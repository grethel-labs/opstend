# Accepted feature subset claimed by a release (card S01).
#
# Scope for the deployable payload and its matching trusted controller checkout,
# based on prior gate evidence in docs/STATUS.md and public configuration.
# Candidate archive acceptance is tracked separately in S01. `release build`
# copies the normalised scope into accepted-subset.json and binds it in the
# manifest, the provenance statement and the signature.
schema: 1
features:
  - id: stage1-core
    description: Hardened single-server install, workload isolation, idempotent second deploy, reboot persistence
    evidence: Prior KVM installation, unchanged redeploy, isolation and reboot checks. See docs/STATUS.md.
  - id: config-recovery
    description: Read-only plan, pending and stale revision conflict checks, and guarded configuration pull with dedicated SSH trust and private output
    evidence: V01 host checks for read-only planning, pending and stale conflicts, and dedicated SSH trust. See docs/STATUS.md.
  - id: scanner-baseline
    description: Opt-in scheduled scanning of host packages and registered project images with bounded OSV and Trivy observations, explicit coverage gaps and dated KEV/EPSS context
    evidence: V03 installed scanner checks for bounded OSV and Trivy behavior and dated threat context. See docs/STATUS.md.
  - id: maintenance-windows-and-health
    description: Weekly maintenance windows with durable per-window admission, project HTTP and TCP probes with response-time thresholds, and the container probe unknown path
    evidence: L03 host checks for window admission, bounded HTTP/TCP and the unknown container probe. Healthy-container G8 is deferred. See docs/STATUS.md.
  - id: private-lan-admin
    description: Private IPv4 admin HTTPS by numeric IP with a managed source policy, automatic LAN selection in the new deployment profile, and optional loopback-only access
    evidence: Prior routed private IPv4 host checks covered automatic bind, numeric-IP TLS, sessions and CSRF. See docs/STATUS.md.
unsupported:
  - "S02: Additional target profiles, including Ubuntu 26.04 arm64, Ubuntu 24.04, Debian and RHEL-compatible systems"
  - "S03: Public administration with OIDC/MFA (admin.access.public)"
  - "Application stacks, including separate group operations, shared group mutations, per-application critical-risk response and application archival/reactivation"
  - "Restic backup activation and scheduled backup/restore workflows"
  - "Verified image updates and rollback, automatic patching and maintenance drills"
  - "AI providers, local-ai, guided login, model selection and AI advice"
  - "Repository deployments, isolated builds and automatic repair"
