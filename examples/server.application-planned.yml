# Prepared application graph example. It is deliberately unavailable for deploy
# until group lifecycle and both isolation modes have passed their VM gates.
schema_version: 1
server:
  name: my-server
  host: 203.0.113.10
  user: deploy
  os_profile: ubuntu-26.04
admin:
  token_ref: file:~/.config/steward/my-server/admin_token
projects: []
applications:
  - id: example
    isolation: separate
    services:
      - id: notes-a
        image: docker.io/library/python@sha256:5862d971d1f0ae26b258cefa4e893556b1d3aba81bd2ff30888704ad378bab67
        source_revision: bundled:sample-notes@0.1.1
        bundle: sample-notes
        command: [python, /app/app.py]
        host_port: 21001
      - id: notes-b
        image: docker.io/library/python@sha256:5862d971d1f0ae26b258cefa4e893556b1d3aba81bd2ff30888704ad378bab67
        source_revision: bundled:sample-notes@0.1.1
        bundle: sample-notes
        command: [python, /app/app.py]
        host_port: 21002
        depends_on: [notes-a]
