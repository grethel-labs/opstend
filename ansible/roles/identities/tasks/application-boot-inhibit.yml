---
- name: Inspect existing application boot authority
  ansible.builtin.stat:
    path: /var/lib/steward/application-boot.json
    follow: false
    get_checksum: false
  register: identities_application_boot_authority

- name: Inspect existing application boot unit
  ansible.builtin.stat:
    path: /etc/systemd/system/steward-applications.service
    follow: false
    get_checksum: false
  register: identities_application_boot_unit

- name: Inspect an interrupted application boot transition
  ansible.builtin.stat:
    path: /run/steward-applications/hold
    follow: false
    get_checksum: false
  register: identities_application_boot_hold

- name: Inspect the private application ownership manifest before reconciliation
  ansible.builtin.stat:
    path: /var/lib/steward/application-units.json
    follow: false
    get_checksum: false
  register: identities_application_boot_manifest
  when: site_private_application | default(false)

- name: Determine whether this deployment owns application boot
  ansible.builtin.set_fact:
    identities_application_boot_previous: >-
      {{ identities_application_boot_authority.stat.exists or
         identities_application_boot_unit.stat.exists or identities_application_boot_hold.stat.exists or
         (identities_application_boot_manifest.stat.exists | default(false)) }}
    identities_application_active_users: >-
      {{ steward_applications | default([]) | map(attribute='services') | flatten |
         selectattr('deploy') | map(attribute='user') | unique | sort }}

- name: Capture the application boot generation inputs
  ansible.builtin.set_fact:
    identities_application_boot_inputs:
      revision: "{{ steward_config_revision }}"
      release:
        version: "{{ steward_release.version }}"
        files: "{{ steward_release.files }}"
  when: identities_application_boot_previous or identities_application_active_users | length > 0

- name: Identify the application boot generation
  ansible.builtin.set_fact:
    identities_application_boot_generation: "{{ identities_application_boot_inputs | to_json(sort_keys=true) | hash('sha256') }}"
  when: identities_application_boot_inputs is defined

- name: Inhibit application boot while reconciling deployment
  ansible.builtin.command:
    argv: >-
      {{ ['/opt/steward/current/venv/bin/python', '-m', 'steward.application_boot',
          'inhibit', identities_application_boot_generation]
         + (site_application_boot_arguments if site_private_application | default(false) else []) }}
  no_log: "{{ site_private_application | default(false) }}"
  register: identities_application_boot_inhibit
  changed_when: identities_application_boot_inhibit.rc == 0 and (identities_application_boot_inhibit.stdout | from_json).changed
  when: >-
    identities_application_boot_previous or
    ((site_private_application | default(false)) and identities_application_active_users | length > 0)
