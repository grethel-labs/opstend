---
# Identities are created once and never renumbered. Sub-ID ranges are only
# checked afterwards: reassigning them would orphan container storage.
# steward-exec: may connect to the executor socket (the executor still decides
# per peer uid). steward-obs: may read the controller snapshot and query events.
- name: Create platform access groups
  ansible.builtin.group:
    name: "{{ item }}"
    system: true
  loop: [steward-exec, steward-obs]

- name: Create platform service users
  ansible.builtin.user:
    name: "{{ item.name }}"
    system: true
    shell: /usr/sbin/nologin
    home: /nonexistent
    create_home: false
    groups: "{{ item.groups }}"
    password: "!"
  loop:
    - { name: steward-api, groups: [steward-exec, steward-obs] }
    - name: steward-ctl
      groups: "{{ ['steward-exec', 'steward-obs'] if steward_backup.enabled else ['steward-exec'] }}"
    - { name: steward-col, groups: [steward-exec, steward-obs] }
    - { name: steward-notify, groups: [steward-obs] }
    - { name: steward-bot, groups: [steward-obs] }
    - { name: steward-scan, groups: [steward-exec, steward-obs] }
    - name: steward-backup
      groups: "{{ ['steward-exec', 'steward-obs'] if steward_backup.enabled else [] }}"
  loop_control:
    label: "{{ item.name }}"

- name: Create protected backup import root
  ansible.builtin.file:
    path: /var/lib/steward-backup-import
    state: directory
    owner: root
    group: steward-backup
    mode: "0750"

- name: Create private backup upload state
  ansible.builtin.file:
    path: /var/lib/steward-backup
    state: directory
    owner: steward-backup
    group: steward-backup
    mode: "0700"

- name: Create base directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - /srv/steward
    - /srv/steward/projects
    - /etc/containers/systemd/users
    - /var/lib/steward
    - /var/lib/steward/images

- name: Create container service users
  ansible.builtin.user:
    name: "{{ item.name }}"
    shell: /usr/sbin/nologin
    home: "{{ item.home }}"
    create_home: true
    uid_min: 20000
    uid_max: 29999
    password: "!"
  loop: "{{ steward_service_users }}"
  loop_control:
    label: "{{ item.name }}"
  register: identities_created

- name: Record service user ids
  ansible.builtin.set_fact:
    steward_uids: "{{ dict(identities_created.results | map(attribute='item.name') | zip(identities_created.results | map(attribute='uid', default=0))) }}"

- name: Restrict service home directories
  ansible.builtin.file:
    path: "{{ item.home }}"
    state: directory
    owner: "{{ item.name }}"
    group: "{{ item.name }}"
    mode: "0750"
  loop: "{{ steward_service_users }}"
  loop_control:
    label: "{{ item.name }}"
  when: not ansible_check_mode

- name: Read subordinate id ranges
  ansible.builtin.slurp:
    path: "{{ item }}"
  loop: [/etc/subuid, /etc/subgid]
  register: identities_subids

- name: Require persistent subordinate id ranges
  ansible.builtin.assert:
    that:
      - (identities_subids.results[0].content | b64decode) is search('(?m)^' ~ item.name ~ ':[0-9]+:65536$')
      - (identities_subids.results[1].content | b64decode) is search('(?m)^' ~ item.name ~ ':[0-9]+:65536$')
    fail_msg: >-
      {{ item.name }} has no 65536-wide subuid/subgid range. Ranges are never reassigned
      automatically; fix /etc/subuid and /etc/subgid manually.
  loop: "{{ steward_service_users }}"
  loop_control:
    label: "{{ item.name }}"
  when: not ansible_check_mode

- name: Enable lingering so services start at boot
  ansible.builtin.command:
    argv: [loginctl, enable-linger, "{{ item.name }}"]
    creates: "/var/lib/systemd/linger/{{ item.name }}"
  loop: "{{ steward_service_users }}"
  loop_control:
    label: "{{ item.name }}"

- name: Start user managers
  ansible.builtin.systemd_service:
    name: "user@{{ steward_uids[item.name] }}.service"
    state: started
  loop: "{{ steward_service_users }}"
  loop_control:
    label: "{{ item.name }}"
  when: not ansible_check_mode

- name: Create Quadlet directories (root-owned, not writable by the service)
  ansible.builtin.file:
    path: "/etc/containers/systemd/users/{{ steward_uids[item.name] }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop: "{{ steward_service_users }}"
  loop_control:
    label: "{{ item.name }}"
  when: not ansible_check_mode

- name: Create project data directories
  ansible.builtin.file:
    path: "/srv/steward/projects/{{ item.id }}/data"
    state: directory
    owner: "{{ item.user }}"
    group: "{{ item.user }}"
    mode: "0700"
  loop: "{{ steward_projects }}"
  loop_control:
    label: "{{ item.id }}"
  when: not ansible_check_mode

- name: Prepare private application identities before resolving firewall UIDs
  ansible.builtin.include_tasks: applications.yml
  when:
    - steward_application_users | default([]) | length > 0
    - not ansible_check_mode

- name: Check for prior private application deployment
  ansible.builtin.stat:
    path: /var/lib/steward/application-units.json
    follow: false
    get_checksum: false
  register: identities_application_manifest
  when: not ansible_check_mode

- name: Verify applications can transition to the desired firewall policy
  ansible.builtin.include_tasks: application-transition.yml
  when:
    - not ansible_check_mode
    - (steward_applications | default([]) | length > 0) or identities_application_manifest.stat.exists

- name: Establish the dedicated identity before resolving the firewall policy
  when:
    - steward_hardening.firewall.manage
    - not ansible_check_mode
  vars:
    identities_repository_fetch_check: |
      import grp
      import os
      import pwd
      import subprocess
      from pathlib import Path

      name = "steward-repo-fetch"

      def require(condition):
          if not condition:
              raise SystemExit("unsafe repository fetch system identity")

      groups = [entry for entry in grp.getgrall() if entry.gr_name == name]
      users = [entry for entry in pwd.getpwall() if entry.pw_name == name]
      for lookup, entries in ((grp.getgrnam, groups), (pwd.getpwnam, users)):
          try:
              record = lookup(name)
          except KeyError:
              require(not entries)
          else:
              require(entries == [record])

      limits = {"SYS_UID_MAX": 999, "SYS_GID_MAX": 999}
      for line in Path("/etc/login.defs").read_text().splitlines():
          fields = line.split("#", 1)[0].split()
          if fields and fields[0] in limits:
              limits[fields[0]] = int(fields[1])

      if groups:
          group = groups[0]
          require(0 < group.gr_gid <= limits["SYS_GID_MAX"])
          require(not group.gr_mem)
          require(grp.getgrgid(group.gr_gid) == group)
          require([entry for entry in grp.getgrall() if entry.gr_gid == group.gr_gid] == groups)
          require([entry for entry in pwd.getpwall() if entry.pw_gid == group.gr_gid] == users)
          local_groups = Path("/etc/group").read_text().splitlines()
          require(sum(line.split(":")[0] == name for line in local_groups) == 1)
          require(name + ":x:" + str(group.gr_gid) + ":" in local_groups)

      if users:
          user = users[0]
          require(groups and 0 < user.pw_uid <= limits["SYS_UID_MAX"])
          require(user.pw_gid == groups[0].gr_gid)
          require(user.pw_dir == "/nonexistent" and user.pw_shell == "/usr/sbin/nologin")
          require(pwd.getpwuid(user.pw_uid) == user)
          require([entry for entry in pwd.getpwall() if entry.pw_uid == user.pw_uid] == users)
          require(set(os.getgrouplist(name, user.pw_gid)) == {user.pw_gid})
          command = ["/usr/bin/getent", "-s", "files", "passwd", name]
          fields = subprocess.check_output(command, text=True).strip().split(":")
          require(fields[2:4] == [str(user.pw_uid), str(user.pw_gid)])
          require(fields[5:] == [user.pw_dir, user.pw_shell])
          shadow = Path("/etc/shadow").read_text().splitlines()
          require(sum(line.split(":")[0] == name and line.split(":")[1].startswith(("!", "*"))
                      for line in shadow) == 1)

      require(not os.path.lexists("/var/lib/systemd/linger/" + name))
      for path in ("/etc/subuid", "/etc/subgid"):
          try:
              records = Path(path).read_text().splitlines()
          except FileNotFoundError:
              continue
          owners = {name, str(users[0].pw_uid)} if users else {name}
          require(not any(line.split(":")[0] in owners for line in records))
  block:
    - name: Check for collisions with the dedicated repository fetch identity
      ansible.builtin.command:
        argv: [/usr/bin/python3, -I, -c, "{{ identities_repository_fetch_check }}"]
      changed_when: false

    - name: Create the dedicated repository fetch group
      ansible.builtin.group:
        name: steward-repo-fetch
        system: true

    - name: Create the inert repository fetch user
      ansible.builtin.user:
        name: steward-repo-fetch
        group: steward-repo-fetch
        groups: ''
        system: true
        create_home: false
        home: /nonexistent
        shell: /usr/sbin/nologin
        password: "!"
        update_password: on_create

    - name: Verify the dedicated repository fetch identity before firewall rendering
      ansible.builtin.command:
        argv: [/usr/bin/python3, -I, -c, "{{ identities_repository_fetch_check }}"]
      changed_when: false
