---
- name: Create private application home parent
  ansible.builtin.file:
    path: /srv/steward/application-users
    state: directory
    owner: root
    group: root
    mode: "0755"
    follow: false

- name: Create protected numerical identity record directory
  ansible.builtin.file:
    path: /var/lib/steward/application-identities
    state: directory
    owner: root
    group: root
    mode: "0700"
    follow: false

- name: Install dedicated identity inspection helper
  ansible.builtin.copy:
    src: application-identity.py
    dest: /var/lib/steward/application-identity.py
    owner: root
    group: root
    mode: "0600"

- name: Inspect existing dedicated application accounts
  ansible.builtin.command:
    argv: [/usr/bin/python3, /var/lib/steward/application-identity.py, "{{ item.name }}", "{{ item.home }}"]
  loop: "{{ steward_application_users }}"
  loop_control:
    label: "{{ item.name }}"
  register: identities_existing_applications
  changed_when: false

- name: Allocate a stable application account and private group
  ansible.builtin.user:
    name: "{{ item.item.name }}"
    shell: /usr/sbin/nologin
    home: "{{ item.item.home }}"
    create_home: false
    uid_min: 30000
    uid_max: 39999
    password: "!"
  loop: "{{ identities_existing_applications.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  when: not (item.stdout | from_json).exists

- name: Verify unique account and subordinate IDs and prepare private home
  ansible.builtin.command:
    argv: [/usr/bin/python3, /var/lib/steward/application-identity.py, "{{ item.name }}", "{{ item.home }}", --create-home]
  loop: "{{ steward_application_users }}"
  loop_control:
    label: "{{ item.name }}"
  register: identities_verified_applications
  changed_when: (identities_verified_applications.stdout | from_json).changed

- name: Initialize dedicated application identity facts
  ansible.builtin.set_fact:
    steward_application_ids: {}

- name: Record actual application user, group and subordinate IDs
  ansible.builtin.set_fact:
    steward_application_ids: "{{ steward_application_ids | combine({item.item.name: application_ids}) }}"
    steward_uids: "{{ steward_uids | combine({item.item.name: application_ids.uid}) }}"
  vars:
    application_ids: "{{ item.stdout | from_json }}"
  loop: "{{ identities_verified_applications.results }}"
  loop_control:
    label: "{{ item.item.name }}"

- name: Require one firewall dispatch for each dedicated account
  ansible.builtin.assert:
    that:
      - steward_application_egress | map(attribute='user') | sort == steward_application_ids.keys() | sort
