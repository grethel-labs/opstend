---
- name: Inspect the candidate image archive path
  ansible.builtin.stat:
    path: "{{ image_archive }}"
    follow: false
    get_checksum: false
  register: image_candidate_archive

- name: Verify cached image archive ownership and type
  ansible.builtin.assert:
    that:
      - image_candidate_archive.stat.isreg
      - image_candidate_archive.stat.uid == 0
      - image_candidate_archive.stat.gid == 0
      - image_candidate_archive.stat.mode == '0644'
      - image_candidate_archive.stat.nlink == 1
      - image_candidate_archive.stat.size > 0
  when: image_candidate_archive.stat.exists

- name: Materialize the tag-specific image archive
  when: not image_candidate_archive.stat.exists and not ansible_check_mode
  block:
    - name: Fetch the pinned application image with bounded retries
      ansible.builtin.command:
        argv: [podman, pull, --quiet, "{{ image_ref }}"]
        creates: "{{ image_archive }}"
      register: image_candidate_pull
      retries: 2
      delay: 2
      until: image_candidate_pull.rc == 0

    - name: Tag the pinned application image locally
      ansible.builtin.command:
        argv: [podman, tag, "{{ image_ref }}", "{{ image_tag }}"]
        creates: "{{ image_archive }}"

    - name: Allocate temporary archive storage beside the final archive
      ansible.builtin.tempfile:
        path: "{{ image_archive | dirname }}"
        suffix: .tar
      register: image_candidate_temp

    - name: Save the archive before publishing it for rootless users
      ansible.builtin.command:
        argv: [podman, save, --quiet, --format, oci-archive, --output, "{{ image_candidate_temp.path }}", "{{ image_tag }}"]
        creates: "{{ image_archive }}"

    - name: Allow rootless users to read the completed archive
      ansible.builtin.file:
        path: "{{ image_candidate_temp.path }}"
        owner: root
        group: root
        mode: "0644"

    - name: Publish the completed archive atomically
      ansible.builtin.command:
        argv: [mv, --, "{{ image_candidate_temp.path }}", "{{ image_archive }}"]
        creates: "{{ image_archive }}"

  always:
    - name: Remove an unfinished temporary archive
      ansible.builtin.file:
        path: "{{ image_candidate_temp.path }}"
        state: absent
      when: image_candidate_temp.path is defined
