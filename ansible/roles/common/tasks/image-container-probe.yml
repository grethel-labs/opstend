---
- name: "Prepare image archive for {{ image_user }}"
  ansible.builtin.command:
    argv:
      - /opt/steward/current/venv/bin/python
      - -I
      - -m
      - steward.core.image_transport
      - prepare
      - "{{ image_archive }}"
      - "{{ image_ref }}"
      - "{{ image_tag }}"
  become: true
  become_user: root
  register: image_probe_archive
  changed_when: image_probe_archive.rc == 0 and (image_probe_archive.stdout | from_json).changed

- name: "Report an offline image archive limitation for {{ image_user }}"
  ansible.builtin.debug:
    msg: "{{ image_probe_archive.stderr }}"
  when: image_probe_archive.stderr | length > 0

- name: Deliver the verified image to the service store
  block:
    - name: "Verify or load the image for {{ image_user }}"
      ansible.builtin.command:
        argv:
          - /opt/steward/current/venv/bin/python
          - -I
          - -m
          - steward.core.image_transport
          - load
          - "{{ image_archive }}"
          - "{{ image_tag }}"
          - "{{ (image_probe_archive.stdout | from_json).image_id }}"
      become: true
      become_user: "{{ image_user }}"
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ steward_uids[image_user] }}"
      register: image_probe_load
      changed_when: image_probe_load.rc == 0 and (image_probe_load.stdout | from_json).changed

  rescue:
    - name: Rebuild the archive from the exact pinned image
      ansible.builtin.command:
        argv:
          - /opt/steward/current/venv/bin/python
          - -I
          - -m
          - steward.core.image_transport
          - prepare
          - "{{ image_archive }}"
          - "{{ image_ref }}"
          - "{{ image_tag }}"
          - --rebuild
      become: true
      become_user: root
      register: image_probe_archive
      changed_when: image_probe_archive.rc == 0 and (image_probe_archive.stdout | from_json).changed

    - name: "Reload and verify the rebuilt image for {{ image_user }}"
      ansible.builtin.command:
        argv:
          - /opt/steward/current/venv/bin/python
          - -I
          - -m
          - steward.core.image_transport
          - load
          - "{{ image_archive }}"
          - "{{ image_tag }}"
          - "{{ (image_probe_archive.stdout | from_json).image_id }}"
          - --reload
      become: true
      become_user: "{{ image_user }}"
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ steward_uids[image_user] }}"
      register: image_probe_load
      changed_when: image_probe_load.rc == 0 and (image_probe_load.stdout | from_json).changed
