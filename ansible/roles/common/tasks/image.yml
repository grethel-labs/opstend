---
# Root fetches the image by digest once, gives it a local tag derived from that
# digest and stores it as an archive. Service users load from the archive, so
# no service needs registry egress.
# Parameters: image_ref, image_tag, image_user, image_archive
# Ordinary projects can select the probe-specific archive transfer.
- name: Transfer the image for a registered container probe
  ansible.builtin.include_tasks: image-container-probe.yml
  when: image_registered_container_probe | default(false) and not ansible_check_mode

- name: "Fetch {{ image_ref }}"
  ansible.builtin.command:
    argv: [podman, pull, --quiet, "{{ image_ref }}"]
    creates: "{{ image_archive }}"
  when:
    - not (image_registered_container_probe | default(false))
    - not (image_bounded_retry | default(false))

- name: "Tag {{ image_ref }}"
  ansible.builtin.command:
    argv: [podman, tag, "{{ image_ref }}", "{{ image_tag }}"]
    creates: "{{ image_archive }}"
  when:
    - not (image_registered_container_probe | default(false))
    - not (image_bounded_retry | default(false))

- name: "Archive {{ image_ref }}"
  ansible.builtin.command:
    argv: [podman, save, --quiet, --format, oci-archive, --output, "{{ image_archive }}", "{{ image_tag }}"]
    creates: "{{ image_archive }}"
  when:
    - not (image_registered_container_probe | default(false))
    - not (image_bounded_retry | default(false))

- name: Prepare the candidate image archive
  ansible.builtin.include_tasks: image-candidate.yml
  when: image_bounded_retry | default(false)

- name: "Check image of {{ image_user }}"
  ansible.builtin.command:
    argv: [podman, image, exists, "{{ image_tag }}"]
    chdir: /
  become: true
  become_user: "{{ image_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ steward_uids[image_user] }}"
  register: image_present
  changed_when: false
  failed_when: image_present.rc not in [0, 1]
  check_mode: false
  when:
    - not (image_registered_container_probe | default(false))
    - not ansible_check_mode

- name: "Load image for {{ image_user }}"
  ansible.builtin.command:
    argv: [podman, load, --quiet, --input, "{{ image_archive }}"]
    chdir: /
  become: true
  become_user: "{{ image_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ steward_uids[image_user] }}"
  register: image_load
  changed_when: true
  retries: "{{ 2 if (image_bounded_retry | default(false)) else 0 }}"
  delay: 2
  until: image_load.rc == 0
  when:
    - not (image_registered_container_probe | default(false))
    - not ansible_check_mode
    - image_present.rc == 1
