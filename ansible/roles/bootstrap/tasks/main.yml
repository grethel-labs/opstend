---
- name: Atomically claim installation ownership before changing the host
  ansible.builtin.script:
    cmd: >-
      claim.py {{ '--guarded' if site_guarded | default(false) else '' }}
      {{ steward_server_name | quote }} {{ steward_config_revision | quote }}
    executable: /usr/bin/python3
  register: bootstrap_claim
  changed_when: "'claimed' in bootstrap_claim.stdout"
  when: not ansible_check_mode
