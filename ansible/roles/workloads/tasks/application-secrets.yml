---
- name: Gather application secrets locally
  ansible.builtin.set_fact:
    workload_service_secret_values: {}
  no_log: true

- name: Read configured application secret values once
  ansible.builtin.set_fact:
    workload_service_secret_values: "{{ workload_service_secret_values | combine({item.name: application_secret}) }}"
  vars:
    application_secret: >-
      {{ lookup('ansible.builtin.env', item.target, default=undef()) if item.kind == 'env'
         else lookup('ansible.builtin.file', item.target).strip() }}
  loop: "{{ application_service.secrets }}"
  no_log: true

- name: Reject empty secrets and environment file line injection
  ansible.builtin.assert:
    that:
      - item.value | length > 0
      - not (item.value is search('[\r\n\x00]'))
  loop: "{{ workload_service_secret_values | dict2items }}"
  no_log: true

- name: Hash the exact protected environment content for activation
  ansible.builtin.set_fact:
    workload_application_secrets: "{{ workload_application_secrets | combine({application_service.id: application_environment | hash('sha256')}) }}"
    workload_application_secret_payloads: >-
      {{ workload_application_secret_payloads | combine({application_service.id:
        {'content': application_environment, 'present': workload_service_secret_values | length > 0}}) }}
  vars:
    application_environment: |
      {% for name, value in workload_service_secret_values | dictsort %}
      {{ name }}={{ value }}
      {% endfor %}
  no_log: true
