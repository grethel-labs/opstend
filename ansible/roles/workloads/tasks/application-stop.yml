---
- name: Inspect authority of the previous application unit
  ansible.builtin.include_tasks: application-authority.yml
  vars:
    application_allow_missing_unit: true

- name: Stop the previous application unit
  ansible.builtin.systemd_service:
    name: "{{ application_unit.unit }}"
    scope: user
    state: stopped
  become: true
  become_user: "{{ application_unit.user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ steward_uids[application_unit.user] }}"
  when: "'LoadState=not-found' not in workload_application_authority.stdout_lines"
