---
- name: Resolve active application manager UIDs
  ansible.builtin.set_fact:
    workloads_application_boot_uids: "{{ identities_application_active_users | map('extract', steward_uids) | unique | sort }}"

- name: Create root-owned drop-in directories for dedicated active application managers
  ansible.builtin.file:
    path: "/etc/systemd/system/user@{{ item }}.service.d"
    state: directory
    owner: root
    group: root
    mode: "0755"
    follow: false
  loop: "{{ workloads_application_boot_uids }}"

- name: Tie dedicated application managers to the verified firewall unit
  ansible.builtin.copy:
    dest: "/etc/systemd/system/user@{{ item }}.service.d/90-steward-applications.conf"
    content: |
      # Generated by steward - do not edit.
      [Unit]
      After=steward-firewall.service
      BindsTo=steward-firewall.service
    owner: root
    group: root
    mode: "0644"
    follow: false
  loop: "{{ workloads_application_boot_uids }}"

- name: Load application manager ordering before starting any application manager
  ansible.builtin.systemd_service:
    daemon_reload: true
