---
- name: Observe the application unit's loaded and active state
  ansible.builtin.command:
    argv: [systemctl, --user, show, --property=LoadState, --property=ActiveState, "{{ application_unit.unit }}"]
  become: true
  become_user: "{{ application_unit.user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ steward_uids[application_unit.user] }}"
  register: workload_application_observed
  changed_when: false
  failed_when: >-
    workload_application_observed.rc != 0 or
    'LoadState=loaded' not in workload_application_observed.stdout_lines or
    (
      ('ActiveState=active' not in workload_application_observed.stdout_lines) if application_expected_active
      else ('ActiveState=inactive' not in workload_application_observed.stdout_lines and
            'ActiveState=failed' not in workload_application_observed.stdout_lines)
    )
