---
- name: Require the exact verified firewall before application activation
  ansible.builtin.include_tasks: application-firewall.yml

- name: Start the application unit
  ansible.builtin.systemd_service:
    name: "{{ application_unit.unit }}"
    scope: user
    state: started
  register: workload_application_started
  become: true
  become_user: "{{ application_unit.user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ steward_uids[application_unit.user] }}"

- name: Wait for the application's HTTP health endpoint before starting dependents
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ application_unit.host_port }}{{ application_unit.health_path }}"
    status_code: "{{ range(200, 300) | list }}"
    follow_redirects: none
    use_proxy: false
    use_netrc: false
    timeout: "{{ application_unit.health_timeout_s }}"
  no_log: true
  register: workload_application_health
  retries: 6
  delay: 2
  until: workload_application_health.status in range(200, 300)
  when: application_unit.host_port is defined

- name: Verify the started unit
  ansible.builtin.include_tasks: application-observe.yml
  vars:
    application_expected_active: true
