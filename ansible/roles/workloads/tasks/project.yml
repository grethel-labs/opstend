---
- name: "Transfer secrets of {{ project.id }}"
  ansible.builtin.copy:
    dest: "/etc/steward/secrets/projects/{{ project.id }}.env"
    content: |
      {% for secret in project.secrets %}
      {{ secret.name }}={{ lookup('ansible.builtin.env', secret.target) if secret.kind == 'env' else lookup('ansible.builtin.file', secret.target) }}
      {% endfor %}
    owner: root
    group: "{{ project.user }}"
    mode: "0640"
  no_log: true
  diff: false
  register: project_secrets
  when: project.secrets | length > 0

- name: "Provide image of {{ project.id }}"
  ansible.builtin.include_tasks: ../../common/tasks/image.yml
  vars: &project_image_vars
    image_ref: "{{ project.image }}"
    image_tag: "{{ project.image_tag }}"
    image_user: "{{ project.user }}"
    image_archive: "/var/lib/steward/images/{{ [project.image, project.image_tag] | to_json | hash('sha256') }}.tar"
    image_registered_container_probe: "{{ steward_registry.projects[project.id].health_probe | default('http') == 'container' }}"
  when: project.deploy or not image_registered_container_probe

- name: "Check the managed container image of {{ project.id }}"
  ansible.builtin.command:
    argv:
      - /opt/steward/current/venv/bin/python
      - -I
      - -m
      - steward.core.image_transport
      - drift
      - "{{ project.id }}"
      - "{{ (image_probe_archive.stdout | from_json).image_id }}"
  become: true
  become_user: "{{ project.user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ steward_uids[project.user] }}"
  register: project_image_drift
  changed_when: false
  when:
    - not ansible_check_mode
    - project.deploy
    - steward_registry.projects[project.id].health_probe | default('http') == 'container'

- name: "Install Quadlet of {{ project.id }}"
  ansible.builtin.copy:
    dest: "/etc/containers/systemd/users/{{ steward_uids[project.user] }}/{{ project.id }}.container"
    content: "{{ project.quadlet }}"
    owner: root
    group: root
    mode: "0644"
  register: project_quadlet
  when: not ansible_check_mode

- name: "Set service state of {{ project.id }}"
  ansible.builtin.systemd_service:
    name: "{{ project.id }}.service"
    scope: user
    daemon_reload: true
    state: >-
      {{ 'stopped' if not project.deploy
         else ('restarted' if (project_quadlet is changed or project_secrets is changed
                               or (project_image_drift.stdout | default('{}', true) | from_json).drift | default(false))
               else 'started') }}
  become: true
  become_user: "{{ project.user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ steward_uids[project.user] }}"
  when: not ansible_check_mode

- name: "Provide the image after stopping disabled project {{ project.id }}"
  ansible.builtin.include_tasks: ../../common/tasks/image.yml
  vars: *project_image_vars
  when:
    - not ansible_check_mode
    - not project.deploy
    - image_registered_container_probe
