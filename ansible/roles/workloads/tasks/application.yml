---
- name: Create protected application paths and verify data ownership
  ansible.builtin.command:
    argv: [/opt/steward/current/venv/bin/python, -m, steward.application_layout, directories]
    stdin: "{{ {'application': application, 'ids': steward_application_ids} | to_json }}"
  register: workload_application_layout
  changed_when: workload_application_layout.rc == 0 and (workload_application_layout.stdout | from_json).changed
  no_log: true

- name: Verify and restore any retired archive before this application can start
  ansible.builtin.command:
    argv: [/opt/steward/current/venv/bin/python, -m, steward.application_archive, reactivate]
    stdin: "{{ {'application': application, 'ids': steward_application_ids} | to_json }}"
  register: workload_application_archive
  changed_when: workload_application_archive.rc == 0 and (workload_application_archive.stdout | from_json).changed
  no_log: true

- name: Prepare per-application activation inputs
  ansible.builtin.set_fact:
    workload_application_secrets: {}
    workload_application_secret_payloads: {}
    workload_application_service_items: "{{ application.services }}"
    workload_application_identity_inputs: {}
    workload_application_enabled: "{{ application.services | selectattr('deploy') | list }}"
    workload_application_users: "{{ application.services | map(attribute='user') | unique | list }}"
    workload_application_receipt: "/var/lib/steward/application-activations/{{ application.id }}"
  no_log: true

- name: Read and hash planned protected application environment files
  ansible.builtin.include_tasks: application-secrets.yml
  loop: "{{ workload_application_service_items }}"
  loop_control:
    loop_var: application_service
    label: "{{ application_service.id }}"

- name: Bind every application service to its stable numerical identity
  ansible.builtin.set_fact:
    workload_application_identity_inputs: >-
      {{ workload_application_identity_inputs | combine({item: steward_application_ids[item] |
         dict2items | selectattr('key', 'in', ['uid', 'gid', 'subuid', 'subgid']) | items2dict}) }}
  loop: "{{ workload_application_users }}"
  no_log: true

- name: Calculate desired application activation fingerprint
  ansible.builtin.set_fact:
    workload_application_fingerprint: >-
      {{ {'files': steward_release.files, 'application': application,
          'ids': workload_application_identity_inputs, 'secrets': workload_application_secrets,
          'firewall': steward_nftables | hash('sha256')} | to_json(sort_keys=true) | hash('sha256') }}
  no_log: true

- name: Inspect the last successful application activation
  ansible.builtin.stat:
    path: "{{ workload_application_receipt }}"
    follow: false
    get_checksum: false
  register: workload_application_receipt_stat

- name: Verify the activation record's file type and protection
  ansible.builtin.assert:
    that:
      - workload_application_receipt_stat.stat.isreg
      - workload_application_receipt_stat.stat.uid == 0
      - workload_application_receipt_stat.stat.gid == 0
      - workload_application_receipt_stat.stat.mode == '0600'
      - workload_application_receipt_stat.stat.nlink == 1
  when: workload_application_receipt_stat.stat.exists

- name: Read the last successful application activation
  ansible.builtin.slurp:
    src: "{{ workload_application_receipt }}"
  register: workload_application_activated
  when: workload_application_receipt_stat.stat.exists
  no_log: true

- name: Determine whether application activation must be replayed
  ansible.builtin.set_fact:
    workload_application_replay: >-
      {{ (workload_application_activated.content | default('') | b64decode | trim) !=
         workload_application_fingerprint }}
  no_log: true

- name: Drain previous application routes before replay changes an application
  ansible.builtin.command:
    argv: >-
      {{ ['/opt/steward/current/venv/bin/python', '-m', 'steward.application_boot',
          'drain-routes', identities_application_boot_generation]
         + (site_application_boot_arguments if site_private_application | default(false) else []) }}
  no_log: "{{ site_private_application | default(false) }}"
  register: workload_application_routes_drained
  changed_when: workload_application_routes_drained.rc == 0 and (workload_application_routes_drained.stdout | from_json).changed
  when:
    - steward_proxy.application_runtime is defined
    - identities_application_boot_previous
    - workload_application_replay

- name: Materialize protected application environment files after route drain
  ansible.builtin.include_tasks: application-secrets-install.yml
  loop: "{{ workload_application_service_items }}"
  loop_control:
    loop_var: application_service
    label: "{{ application_service.id }}"

- name: Recheck the firewall before starting this application's user managers
  ansible.builtin.include_tasks: application-firewall.yml

- name: Start application user managers for this boot
  ansible.builtin.systemd_service:
    name: "user@{{ steward_uids[item] }}.service"
    state: started
  loop: "{{ workload_application_users }}"

- name: Stop changed or explicitly stopped services in reverse dependency order
  ansible.builtin.include_tasks: application-stop.yml
  loop: "{{ workload_application_service_items | reverse | list }}"
  loop_control:
    loop_var: application_unit
    label: "{{ application_unit.unit }}"
  when: workload_application_replay or not application_unit.deploy

- name: Stop a changed or unused shared pod
  ansible.builtin.include_tasks: application-stop.yml
  vars:
    application_unit: "{{ application.pod }}"
  when: application.pod is not none and (workload_application_replay or workload_application_enabled | length == 0)

- name: Provide tag-specific local images to enabled services
  ansible.builtin.include_tasks: ../../common/tasks/image.yml
  vars:
    image_ref: "{{ application_service.image }}"
    image_tag: "{{ application_service.image_tag }}"
    image_user: "{{ application_service.user }}"
    image_archive: "/var/lib/steward/images/{{ [image_ref, image_tag] | to_json | hash('sha256') }}.tar"
    image_bounded_retry: true
  loop: "{{ workload_application_enabled }}"
  loop_control:
    loop_var: application_service
    label: "{{ application_service.id }}"

- name: Install root-owned application Quadlets
  ansible.builtin.copy:
    dest: "/etc/containers/systemd/users/{{ steward_uids[item.user] }}/{{ item.filename }}"
    content: "{{ item.content }}"
    owner: root
    group: root
    mode: "0644"
    follow: false
  loop: "{{ workload_application_service_items + ([application.pod] if application.pod else []) }}"
  loop_control:
    label: "{{ item.filename }}"

- name: Load the root-owned units into their application user managers
  ansible.builtin.systemd_service:
    scope: user
    daemon_reload: true
  become: true
  become_user: "{{ item }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ steward_uids[item] }}"
  loop: "{{ workload_application_users }}"

- name: Verify the loaded sources of the managed Quadlets
  ansible.builtin.include_tasks: application-authority.yml
  loop: "{{ workload_application_service_items + ([application.pod] if application.pod else []) }}"
  loop_control:
    loop_var: application_unit
    label: "{{ application_unit.unit }}"

- name: Start and verify the shared pod before starting its enabled services
  ansible.builtin.include_tasks: application-start.yml
  vars:
    application_unit: "{{ application.pod }}"
  when: application.pod is not none and workload_application_enabled | length > 0

- name: Prepare data mapped through the running shared pod
  ansible.builtin.include_tasks: application-mapped-data.yml
  when: workload_application_enabled | selectattr('data_needs_mapped_owner') | list | length > 0

- name: Activate and health-check enabled services in dependency order
  ansible.builtin.include_tasks: application-start.yml
  loop: "{{ workload_application_enabled }}"
  loop_control:
    loop_var: application_unit
    label: "{{ application_unit.unit }}"

- name: Verify desired state for every managed service
  ansible.builtin.include_tasks: application-observe.yml
  vars:
    application_expected_active: "{{ application_unit.deploy }}"
  loop: "{{ workload_application_service_items }}"
  loop_control:
    loop_var: application_unit
    label: "{{ application_unit.unit }}"

- name: Verify the desired shared pod state
  ansible.builtin.include_tasks: application-observe.yml
  vars:
    application_unit: "{{ application.pod }}"
    application_expected_active: "{{ workload_application_enabled | length > 0 }}"
  when: application.pod is not none

- name: Record successful application activation
  ansible.builtin.copy:
    dest: "{{ workload_application_receipt }}"
    content: "{{ workload_application_fingerprint }}\n"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  diff: false
