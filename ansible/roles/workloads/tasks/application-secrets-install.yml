---
- name: Install the protected application environment file
  ansible.builtin.copy:
    dest: "/etc/steward/secrets/applications/{{ application.id }}/{{ application_service.id }}.env"
    content: "{{ workload_application_secret_payloads[application_service.id].content }}"
    owner: root
    group: "{{ application_service.user }}"
    mode: "0640"
    follow: false
  when: workload_application_secret_payloads[application_service.id].present
  no_log: true
  diff: false

- name: Remove the previous environment file for a service with no secrets
  ansible.builtin.file:
    path: "/etc/steward/secrets/applications/{{ application.id }}/{{ application_service.id }}.env"
    state: absent
  when: not workload_application_secret_payloads[application_service.id].present
  diff: false
