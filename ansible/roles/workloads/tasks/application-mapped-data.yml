---
- name: Prepare and verify shared application data before starting any service
  block:
    - name: Check the mapped ownership supplied by the live shared pod
      ansible.builtin.command:
        argv: [/opt/steward/current/venv/bin/python, -m, steward.application_layout, mapped]
        stdin: "{{ {'application': application, 'ids': steward_application_ids} | to_json }}"
      register: workload_application_mapped
      changed_when: workload_application_mapped.rc == 0 and (workload_application_mapped.stdout | from_json).changed
      no_log: true
  rescue:
    - name: Check an empty pod started by this deployment before stopping it
      when: workload_application_started.changed
      vars:
        workload_application_cleanup_name: "steward-{{ application.pod.filename | splitext | first }}"
      block:
        - name: Inspect the newly started shared pod and its members
          ansible.builtin.command:
            argv: [podman, pod, inspect, "{{ workload_application_cleanup_name }}"]
          become: true
          become_user: "{{ application.pod.user }}"
          environment:
            XDG_RUNTIME_DIR: "/run/user/{{ steward_uids[application.pod.user] }}"
          register: workload_application_cleanup_inspect
          changed_when: false
          failed_when: false
          no_log: true

        - name: Stop only a verified new pod containing just its infrastructure container
          ansible.builtin.include_tasks: application-stop.yml
          vars:
            application_unit: "{{ application.pod }}"
            workload_application_cleanup_pods: "{{ workload_application_cleanup_inspect.stdout | from_json }}"
            workload_application_cleanup_pod: "{{ workload_application_cleanup_pods[0] }}"
          when:
            - workload_application_cleanup_inspect.rc == 0
            - workload_application_cleanup_pods | length == 1
            - workload_application_cleanup_pod.Name == workload_application_cleanup_name
            - workload_application_cleanup_pod.Labels.PODMAN_SYSTEMD_UNIT == application.pod.unit
            - workload_application_cleanup_pod.Containers | length == 1
            - workload_application_cleanup_pod.Containers[0].Id == workload_application_cleanup_pod.InfraContainerID
    - name: Refuse application activation when shared data ownership could not be verified
      ansible.builtin.fail:
        msg: "Shared application data ownership verification failed for {{ application.id }}."
