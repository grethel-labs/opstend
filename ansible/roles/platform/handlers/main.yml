---
- name: Restart platform services
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: restarted
    daemon_reload: true
  loop: "{{ steward_active_platform_units }}"
  notify: Restart backup service

- name: Restart admin API
  ansible.builtin.systemd_service:
    name: steward-api.service
    state: restarted

- name: Restart backup service
  ansible.builtin.systemd_service:
    name: steward-backup.service
    state: restarted
    daemon_reload: true
  when: steward_backup.enabled and not ansible_check_mode
