---
- name: Withdraw managed inference before changing platform or Ollama state
  when: platform_inference_phase == 'withdraw'
  vars:
    platform_inference_descriptions:
      steward-inference-advice-bot.socket: Steward bot advice socket
      steward-inference-advice-api.socket: Steward API advice socket
      steward-inference-advice.service: Steward local advice worker
      steward-inference-tick.timer: Steward local model scan timer
      steward-inference-tick.service: Steward local model scan
      steward-inference-admin.socket: Steward inference administration socket
      steward-inference-admin.service: Steward inference administration worker
  block:
    - name: Inspect the inference authority directory
      ansible.builtin.stat:
        path: /etc/steward/inference
        follow: false
        get_checksum: false
        get_mime: false
      register: platform_inference_authority_dir

    - name: Require a trusted inference authority directory
      ansible.builtin.assert:
        that:
          - platform_inference_authority_dir.stat.isdir | default(false)
          - platform_inference_authority_dir.stat.uid == 0
          - not platform_inference_authority_dir.stat.wgrp
          - not platform_inference_authority_dir.stat.woth
      when: platform_inference_authority_dir.stat.exists

    - name: Inspect the inference projection
      ansible.builtin.stat:
        path: /etc/steward/inference/selection.json
        follow: false
        get_checksum: false
        get_mime: false
      register: platform_inference_projection_file

    - name: Inspect staged inference proof
      ansible.builtin.stat:
        path: /etc/steward/config/inference-stage.json
        follow: false
        get_checksum: false
        get_mime: false
      register: platform_inference_stage_file

    # Legacy installations can have an empty directory without the publisher.
    - name: Revoke the root-managed inference projection
      ansible.builtin.command:
        argv: [/opt/steward/current/venv/bin/python, -I, -m, steward.core.inference_deployment, revoke]
      changed_when: false
      when: platform_inference_projection_file.stat.exists or platform_inference_stage_file.stat.exists

    - name: Check optional inference unit files
      ansible.builtin.stat:
        path: "/etc/systemd/system/{{ item }}"
        follow: false
        get_checksum: false
        get_mime: false
      loop: "{{ platform_inference_descriptions.keys() | list }}"
      register: platform_inference_fragments

    - name: Require trusted systemd roots for inference changes
      when: >-
        steward_inference_candidate is defined or
        platform_inference_fragments.results | selectattr('stat.exists') | list | length > 0
      block:
        - name: Inspect the systemd roots
          ansible.builtin.stat:
            path: "{{ item }}"
            follow: false
            get_checksum: false
            get_mime: false
          loop: [/etc, /etc/systemd, /etc/systemd/system]
          register: platform_inference_systemd_roots

        - name: Refuse unsafe systemd roots
          ansible.builtin.assert:
            that:
              - item.stat.isdir | default(false)
              - item.stat.uid == 0
              - not item.stat.wgrp
              - not item.stat.woth
          loop: "{{ platform_inference_systemd_roots.results }}"
          loop_control:
            label: "{{ item.item }}"

    - name: Read safe inference unit fragments
      ansible.builtin.slurp:
        path: "/etc/systemd/system/{{ item.item }}"
      loop: "{{ platform_inference_fragments.results }}"
      loop_control:
        label: "{{ item.item }}"
      register: platform_inference_fragment_contents
      no_log: true
      when:
        - item.stat.isreg | default(false)
        - item.stat.uid == 0
        - item.stat.nlink == 1
        - item.stat.size <= 65536
        - not item.stat.wgrp
        - not item.stat.woth

    - name: Identify managed inference units in stop order
      ansible.builtin.set_fact:
        platform_inference_owned_units: >-
          {{ (platform_inference_owned_units | default([])) +
             ([item.item.item] if inference_header == inference_expected_header else []) }}
      vars:
        inference_header: "{{ (item.content | default('') | b64decode).splitlines()[:3] }}"
        inference_expected_header:
          - '# Generated by steward - do not edit.'
          - '[Unit]'
          - "Description={{ platform_inference_descriptions[item.item.item] }}"
      loop: "{{ platform_inference_fragment_contents.results }}"
      loop_control:
        label: "{{ item.item.item }}"

    - name: Refuse to replace any foreign inference unit file
      ansible.builtin.assert:
        that: not item.stat.exists or item.item in platform_inference_owned_units
      loop: "{{ platform_inference_fragments.results }}"
      loop_control:
        label: "{{ item.item }}"
      when: steward_inference_candidate is defined

    - name: Inspect systemd authority for optional inference units
      ansible.builtin.command:
        argv:
          - /usr/bin/systemctl
          - show
          - --all
          - --property=LoadState,ActiveState,UnitFileState,FragmentPath,DropInPaths
          - "{{ item }}"
      register: platform_inference_loaded
      changed_when: false
      failed_when: >-
        platform_inference_loaded.rc != 0 and
        'LoadState=not-found' not in platform_inference_loaded.stdout_lines
      loop: "{{ platform_inference_descriptions.keys() | list }}"
      when: >-
        steward_inference_candidate is defined or platform_inference_authority_dir.stat.exists or
        platform_inference_stage_file.stat.exists or platform_inference_owned_units | length > 0

    - name: Refuse foreign systemd inference sources or overrides
      ansible.builtin.assert:
        that:
          - >-
            (item.item in platform_inference_owned_units and 'LoadState=loaded' in item.stdout_lines and
             ('FragmentPath=/etc/systemd/system/' ~ item.item) in item.stdout_lines and
             'DropInPaths=' in item.stdout_lines)
            or ('LoadState=not-found' in item.stdout_lines and 'FragmentPath=' in item.stdout_lines and
                'ActiveState=inactive' in item.stdout_lines and 'DropInPaths=' in item.stdout_lines and
                (['UnitFileState=enabled', 'UnitFileState=enabled-runtime'] |
                 intersect(item.stdout_lines) | length == 0))
            or (steward_inference_candidate is undefined and item.item not in platform_inference_owned_units and
                'ActiveState=inactive' in item.stdout_lines and
                (['UnitFileState=disabled', 'UnitFileState=static', 'UnitFileState=masked', 'UnitFileState=masked-runtime'] |
                 intersect(item.stdout_lines) | length > 0))
      loop: "{{ platform_inference_loaded.results | rejectattr('skipped', 'defined') | list }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Stop both advice activation sockets and their worker together
      ansible.builtin.command:
        argv: "{{ ['/usr/bin/systemctl', 'stop'] + platform_owned_advice_units }}"
      vars:
        platform_owned_advice_units: >-
          {{ platform_inference_owned_units | select('match', '^steward-inference-advice[.-]') | list }}
      when: platform_owned_advice_units | length > 0
      changed_when: true

    - name: Stop managed inference units in order and disable activation
      ansible.builtin.systemd_service:
        name: "{{ item.item }}"
        state: stopped
        enabled: "{{ false if item.item.endswith(('.timer', '.socket')) else omit }}"
      loop: "{{ platform_inference_loaded.results | rejectattr('skipped', 'defined') | list }}"
      loop_control:
        label: "{{ item.item }}"
      when:
        - item.item in platform_inference_owned_units
        - "'LoadState=loaded' in item.stdout_lines"

    # JoinsNamespaceOf is symmetric. Unload the stopped workers before
    # Ollama checks that its unit has no namespace partners.
    - name: Remove retired inference fragments before reconciling Ollama
      ansible.builtin.file:
        path: "/etc/systemd/system/{{ item }}"
        state: absent
      loop: "{{ platform_inference_owned_units | select('match', '^steward-inference-(advice[.-]|tick[.]service$)') | list }}"
      register: platform_inference_retired

    - name: Reload systemd without the retired inference fragments
      ansible.builtin.systemd_service:
        daemon_reload: true
      when: platform_inference_retired is changed

- name: Stage and activate inferred-model selection without authority
  when: platform_inference_phase == 'stage'
  vars:
    platform_inference_advice: "{{ steward_inference_candidate.advice | default(false) }}"
    platform_inference_advice_sockets:
      - steward-inference-advice-bot.socket
      - steward-inference-advice-api.socket
  block:
    - name: Require this run and a successful Ollama installer result
      ansible.builtin.assert:
        that:
          - site_inference_run is match('^[0-9a-f]{32}\\Z')
          - platform_ollama_install.rc == 0

    - name: Bind inference staging to this deployment and installed model store
      ansible.builtin.set_fact:
        platform_inference_payload:
          candidate: "{{ steward_inference_candidate }}"
          ollama: "{{ steward_ollama_local }}"
          run_id: "{{ site_inference_run }}"
          models: "{{ (platform_ollama_install.stdout | from_json).models }}"

    - name: Check the managed Ollama namespace source after installation
      ansible.builtin.command:
        argv:
          - /usr/bin/systemctl
          - show
          - --all
          - --property=LoadState,ActiveState,FragmentPath,DropInPaths,NeedDaemonReload,PrivateNetwork,NetworkNamespacePath,JoinsNamespaceOf
          - steward-ollama.service
      register: platform_inference_ollama
      changed_when: false
      failed_when: >-
        platform_inference_ollama.rc != 0 or
        (['LoadState=loaded', 'ActiveState=active', 'FragmentPath=/etc/systemd/system/steward-ollama.service',
          'DropInPaths=', 'NeedDaemonReload=no', 'PrivateNetwork=yes', 'NetworkNamespacePath=', 'JoinsNamespaceOf=']
         | difference(platform_inference_ollama.stdout_lines) | length > 0)

    - name: Check that the inference socket path is unoccupied
      ansible.builtin.command:
        argv: [/opt/steward/current/venv/bin/python, -I, -m, steward.core.inference_deployment, socket-preflight]
      changed_when: false

    - name: Check each advice socket path before installing its unit
      ansible.builtin.command:
        argv: [/opt/steward/current/venv/bin/python, -I, -m, steward.core.inference_deployment, advice-socket-preflight, "{{ item }}"]
      changed_when: false
      loop: [bot, api]
      when: platform_inference_advice

    - name: Create the private inference group
      ansible.builtin.group:
        name: steward-inference
        system: true

    - name: Create the locked inference identity
      ansible.builtin.user:
        name: steward-inference
        group: steward-inference
        groups: ''
        home: /var/lib/steward-inference
        create_home: false
        shell: /usr/sbin/nologin
        password_lock: true
        system: true

    - name: Resolve the actual inference identity UIDs
      ansible.builtin.getent:
        database: passwd
        key: "{{ item }}"
      loop: "{{ ['steward-inference', 'steward-api', 'steward-ai'] + (['steward-bot'] if platform_inference_advice else []) }}"
      register: platform_inference_identities

    - name: Require distinct non-root inference service and client UIDs
      ansible.builtin.assert:
        that:
          - platform_inference_uids | min > 0
          - platform_inference_uids | unique | length == platform_inference_identities.results | length
      vars:
        platform_inference_uids: >-
          {{ platform_inference_identities.results | map(attribute='ansible_facts.getent_passwd')
             | map('dict2items') | map('first') | map(attribute='value.1') | map('int') | list }}

    - name: Stage a protected proof of the current model installation
      ansible.builtin.command:
        argv: [/opt/steward/current/venv/bin/python, -I, -m, steward.core.inference_deployment, stage]
        stdin: "{{ platform_inference_payload | to_json }}"
      register: platform_inference_staged
      changed_when: true

    - name: Install the private inference unit definitions
      ansible.builtin.template:
        src: "{{ item }}.j2"
        dest: "/etc/systemd/system/{{ item }}"
        owner: root
        group: root
        mode: "0644"
      loop: >-
        {{ ['steward-inference-admin.service', 'steward-inference-admin.socket',
            'steward-inference-tick.service', 'steward-inference-tick.timer'] +
           (platform_inference_advice_sockets + ['steward-inference-advice.service']
            if platform_inference_advice else []) }}
      register: platform_inference_units

    - name: Reload installed private inference units
      ansible.builtin.systemd_service:
        daemon_reload: true

    - name: Require loaded inference units to match the installed unit sources
      ansible.builtin.command:
        argv:
          - /usr/bin/systemctl
          - show
          - --all
          - --property=LoadState,FragmentPath,DropInPaths,NeedDaemonReload
          - "{{ item.item }}"
      loop: "{{ platform_inference_units.results }}"
      loop_control:
        label: "{{ item.item }}"
      register: platform_inference_new_source
      changed_when: false
      failed_when: >-
        platform_inference_new_source.rc != 0 or
        (['LoadState=loaded', 'FragmentPath=/etc/systemd/system/' ~ item.item, 'DropInPaths=', 'NeedDaemonReload=no']
         | difference(platform_inference_new_source.stdout_lines) | length > 0)

    - name: Require the advice worker to join only the verified Ollama namespace
      ansible.builtin.command:
        argv:
          - /usr/bin/systemctl
          - show
          - --all
          - --property=PrivateNetwork,NetworkNamespacePath,JoinsNamespaceOf
          - steward-inference-advice.service
      register: platform_inference_advice_namespace
      changed_when: false
      failed_when: >-
        platform_inference_advice_namespace.rc != 0 or
        (['PrivateNetwork=yes', 'NetworkNamespacePath=', 'JoinsNamespaceOf=steward-ollama.service']
         | difference(platform_inference_advice_namespace.stdout_lines) | length > 0)
      when: platform_inference_advice

    - name: Start the candidate listener and timer before publishing authority
      block:
        - name: Enable and start the inference activation units
          ansible.builtin.systemd_service:
            name: "{{ item }}"
            enabled: true
            state: started
          loop: >-
            {{ ['steward-inference-admin.socket', 'steward-inference-tick.timer'] +
               (platform_inference_advice_sockets if platform_inference_advice else []) }}

        - name: Check joint advice worker startup with both named listeners
          ansible.builtin.systemd_service:
            name: steward-inference-advice.service
            state: started
          when: platform_inference_advice

        - name: Record successful inference unit startup for this run
          ansible.builtin.set_fact:
            platform_inference_started: true

      rescue:
        - name: Stop advice activation together after a failed startup
          ansible.builtin.command:
            argv: >-
              {{ ['/usr/bin/systemctl', 'stop'] + platform_inference_advice_sockets +
                 ['steward-inference-advice.service'] }}
          when: platform_inference_advice
          changed_when: true

        - name: Stop candidate units after a failed startup
          ansible.builtin.systemd_service:
            name: "{{ item }}"
            enabled: "{{ false if item.endswith(('.timer', '.socket')) else omit }}"
            state: stopped
          loop: >-
            {{ (platform_inference_advice_sockets + ['steward-inference-advice.service']
                if platform_inference_advice else []) +
               ['steward-inference-tick.timer', 'steward-inference-tick.service',
                'steward-inference-admin.socket', 'steward-inference-admin.service'] }}

        - name: Fail the deployment before publication
          ansible.builtin.fail:
            msg: Inference unit startup failed.
