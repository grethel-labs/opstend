---
- name: Require the fixed Ollama candidate contract
  ansible.builtin.assert:
    that:
      - steward_ollama_local is mapping
      - steward_ollama_local.keys() | sort == ['ai', 'reserved_memory_mb']
      - steward_ollama_local.reserved_memory_mb is integer
      - steward_ollama_local.reserved_memory_mb == steward_required_memory_mb
      - steward_desired_config.profile == 'api'
      - steward_desired_config.ai.provider == 'none'
      - ansible_facts.architecture == 'x86_64'
    fail_msg: The private Ollama candidate requires a local CPU model on x86_64.
  when: steward_ollama_local is defined

- name: Inspect the Ollama service file
  ansible.builtin.stat:
    path: /etc/systemd/system/steward-ollama.service
    get_checksum: false
    get_mime: false
  register: platform_ollama_unit_file

- name: Read a regular root-owned Ollama service file
  ansible.builtin.slurp:
    path: /etc/systemd/system/steward-ollama.service
  register: platform_ollama_unit_content
  no_log: true
  when:
    - platform_ollama_unit_file.stat.isreg | default(false)
    - platform_ollama_unit_file.stat.uid == 0
    - platform_ollama_unit_file.stat.nlink == 1
    - platform_ollama_unit_file.stat.size <= 65536
    - not platform_ollama_unit_file.stat.wgrp
    - not platform_ollama_unit_file.stat.woth

- name: Identify the Steward-managed Ollama unit
  ansible.builtin.set_fact:
    platform_ollama_owned: >-
      {{ (platform_ollama_unit_content.content | default('') | b64decode).splitlines()[:3] ==
         ['# Generated by steward - do not edit.',
          '[Unit]',
          'Description=Steward isolated Ollama inference'] }}

- name: Refuse to replace a foreign Ollama service file
  ansible.builtin.assert:
    that: not platform_ollama_unit_file.stat.exists or platform_ollama_owned
  when: steward_ollama_local is defined

- name: Inspect Ollama systemd authority and reload state
  ansible.builtin.command:
    argv:
      - /usr/bin/systemctl
      - show
      - --all
      - --property=LoadState,FragmentPath,DropInPaths,NeedDaemonReload,PrivateNetwork,NetworkNamespacePath,JoinsNamespaceOf
      - steward-ollama.service
  register: platform_ollama_authority
  changed_when: false
  failed_when: >-
    platform_ollama_authority.rc != 0 and
    'LoadState=not-found' not in platform_ollama_authority.stdout_lines
  check_mode: false
  when: steward_ollama_local is defined or platform_ollama_owned

- name: Evaluate the loaded Ollama service source
  ansible.builtin.set_fact:
    platform_ollama_expected_source: >-
      {{ 'FragmentPath=/etc/systemd/system/steward-ollama.service' in platform_ollama_authority.stdout_lines
         and 'LoadState=loaded' in platform_ollama_authority.stdout_lines
         and 'DropInPaths=' in platform_ollama_authority.stdout_lines
         and 'JoinsNamespaceOf=' in platform_ollama_authority.stdout_lines
         and 'NetworkNamespacePath=' in platform_ollama_authority.stdout_lines }}
  when: steward_ollama_local is defined or platform_ollama_owned

- name: Require a dedicated systemd unit without overrides
  ansible.builtin.assert:
    that:
      - >-
        (platform_ollama_owned and platform_ollama_expected_source and
         'PrivateNetwork=yes' in platform_ollama_authority.stdout_lines) or
        ('LoadState=not-found' in platform_ollama_authority.stdout_lines and
         'DropInPaths=' in platform_ollama_authority.stdout_lines)
    fail_msg: Refusing to adopt an Ollama service with a foreign source or systemd overrides.
  when: steward_ollama_local is defined

- name: Require the managed Ollama unit source before disabling it
  ansible.builtin.assert:
    that: platform_ollama_expected_source
    fail_msg: The managed Ollama service has a foreign systemd source or overrides.
  when: steward_ollama_local is undefined and platform_ollama_owned

- name: Stop and disable the managed Ollama service on a base deployment
  ansible.builtin.systemd_service:
    name: steward-ollama.service
    state: stopped
    enabled: false
  when:
    - steward_ollama_local is undefined
    - platform_ollama_owned
    - not ansible_check_mode

- name: Install and activate the private Ollama candidate
  when: steward_ollama_local is defined and not ansible_check_mode
  vars:
    platform_ollama_artifacts: "{{ platform_ollama_install.stdout | from_json }}"
    platform_ollama_fingerprint: "{{ lookup('ansible.builtin.template', 'steward-ollama.service.j2') | hash('sha256') }}"
  block:
    - name: Install verified staged Ollama artifacts
      ansible.builtin.command:
        argv: [/opt/steward/current/venv/bin/python, -I, -m, steward.core.ollama_install]
        stdin: "{{ steward_ollama_local | to_json }}"
      register: platform_ollama_install
      changed_when: (platform_ollama_install.stdout | from_json).changed

    - name: Require safe installed Ollama paths
      ansible.builtin.assert:
        that:
          - platform_ollama_artifacts.changed is boolean
          - platform_ollama_artifacts.binary is match('^(/[a-zA-Z0-9_-][a-zA-Z0-9_.-]*)+\\Z')
          - platform_ollama_artifacts.models is match('^(/[a-zA-Z0-9_-][a-zA-Z0-9_.-]*)+\\Z')

    - name: Create the dedicated Ollama group
      ansible.builtin.group:
        name: steward-ai
        system: true

    - name: Create the locked Ollama service identity
      ansible.builtin.user:
        name: steward-ai
        group: steward-ai
        groups: ''
        home: /var/lib/steward-ai
        create_home: false
        shell: /usr/sbin/nologin
        password_lock: true
        system: true

    - name: Install the private Ollama service unit
      ansible.builtin.template:
        src: steward-ollama.service.j2
        dest: /etc/systemd/system/steward-ollama.service
        owner: root
        group: root
        mode: "0644"
      register: platform_ollama_unit

    - name: Read the last activated Ollama unit fingerprint
      ansible.builtin.slurp:
        path: /etc/steward/ollama-activation
      register: platform_ollama_activated
      failed_when: false

    # A loaded unit can still have an old process after an interrupted restart.
    - name: Enable and start the private Ollama service
      ansible.builtin.systemd_service:
        name: steward-ollama.service
        enabled: true
        state: >-
          {{ 'restarted' if platform_ollama_owned and
             (platform_ollama_unit is changed or platform_ollama_install is changed
             or (platform_ollama_activated.content | default('') | b64decode | trim) != platform_ollama_fingerprint
             or 'NeedDaemonReload=yes' in platform_ollama_authority.stdout_lines) else 'started' }}
        daemon_reload: >-
          {{ platform_ollama_unit is changed or not platform_ollama_expected_source
             or 'NeedDaemonReload=yes' in platform_ollama_authority.stdout_lines }}

    - name: Record the activated Ollama unit fingerprint
      ansible.builtin.copy:
        dest: /etc/steward/ollama-activation
        content: "{{ platform_ollama_fingerprint }}\n"
        owner: root
        group: root
        mode: "0600"
