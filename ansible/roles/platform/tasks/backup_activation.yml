---
- name: Calculate backup activation inputs
  ansible.builtin.set_fact:
    platform_backup_activation_inputs:
      config: "{{ steward_backup }}"
      files: "{{ steward_release.files }}"
      unit: "{{ lookup('ansible.builtin.template', 'steward-backup.service.j2') | hash('sha256') }}"
      credentials: {}
  no_log: true

- name: Bind backup activation to credential contents
  ansible.builtin.set_fact:
    platform_backup_activation_inputs: >-
      {{ platform_backup_activation_inputs | combine({'credentials':
         platform_backup_activation_inputs.credentials | combine({item.name: platform_backup_credential | hash('sha256')})}) }}
  vars:
    platform_backup_credential: >-
      {{ lookup('ansible.builtin.env', item.target) if item.kind == 'env'
         else lookup('ansible.builtin.file', item.target, lstrip=true, rstrip=true) }}
  loop: "{{ steward_backup_secrets }}"
  no_log: true

- name: Calculate backup activation fingerprint
  ansible.builtin.set_fact:
    platform_backup_activation_fingerprint: "{{ platform_backup_activation_inputs | to_json(sort_keys=true) | hash('sha256') }}"
  no_log: true

- name: Read last verified backup activation
  ansible.builtin.slurp:
    path: "{{ platform_backup_activation_record_path | default('/etc/steward/backup-activation') }}"
  register: platform_backup_activated
  failed_when: false
  no_log: true

- name: Reconcile backup service after an interrupted activation
  ansible.builtin.debug:
    msg: Backup service activation is reconciled at verification.
  changed_when: >-
    (platform_backup_activated.content | default('') | b64decode | trim) != platform_backup_activation_fingerprint
  notify: Restart backup service
