---
- name: Require a complete backup service contract before changes
  ansible.builtin.assert:
    that:
      - steward_backup.endpoint is not none
      - "'repository' in steward_backup.credentials"
      - "'password' in steward_backup.credentials"
      - "('username' in steward_backup.credentials) == ('auth-password' in steward_backup.credentials)"
    fail_msg: Enabled backup upload needs an endpoint and its declared credentials.
  when: steward_backup.enabled

- name: Inspect installed backup service
  ansible.builtin.stat:
    path: /etc/systemd/system/steward-backup.service
  register: platform_backup_unit_file

- name: Refuse an unsafe backup service unit
  ansible.builtin.assert:
    that:
      - platform_backup_unit_file.stat.isreg | default(false)
      - not (platform_backup_unit_file.stat.islnk | default(false))
      - platform_backup_unit_file.stat.uid == 0
      - platform_backup_unit_file.stat.nlink == 1
      - platform_backup_unit_file.stat.size <= 65536
      - not platform_backup_unit_file.stat.wgrp
      - not platform_backup_unit_file.stat.woth
    fail_msg: Refusing to alter a foreign or unsafe backup service unit.
  when: platform_backup_unit_file.stat.exists

- name: Read the existing backup service ownership header
  ansible.builtin.slurp:
    path: /etc/systemd/system/steward-backup.service
  register: platform_backup_unit_content
  no_log: true
  when: platform_backup_unit_file.stat.exists

- name: Refuse a foreign backup service unit
  ansible.builtin.assert:
    that:
      - >-
        (platform_backup_unit_content.content | b64decode).startswith(
        '# Generated by steward - do not edit.\n[Unit]\nDescription=steward encrypted backup upload worker\n')
    fail_msg: Refusing to alter a foreign backup service unit.
  when: platform_backup_unit_file.stat.exists

- name: Stop and disable the backup service when disabled
  ansible.builtin.systemd_service:
    name: steward-backup.service
    state: stopped
    enabled: false
  when: not steward_backup.enabled and platform_backup_unit_file.stat.exists and not ansible_check_mode

- name: Inspect backup credential directory
  ansible.builtin.stat:
    path: /etc/steward/secrets/backup
  register: platform_backup_credential_dir

- name: Refuse an unsafe credential directory when enabling backups
  ansible.builtin.assert:
    that:
      - platform_backup_credential_dir.stat.isdir | default(false)
      - not (platform_backup_credential_dir.stat.islnk | default(false))
      - platform_backup_credential_dir.stat.uid == 0
      - platform_backup_credential_dir.stat.mode == '0700'
    fail_msg: Refusing to adopt a foreign or unsafe backup credential directory.
  when: steward_backup.enabled and platform_backup_credential_dir.stat.exists

- name: Inspect credential directory ownership marker
  ansible.builtin.stat:
    path: /etc/steward/secrets/backup/.steward-owned
  register: platform_backup_credential_marker
  when: >-
    platform_backup_credential_dir.stat.exists and
    (platform_backup_credential_dir.stat.isdir | default(false)) and
    not (platform_backup_credential_dir.stat.islnk | default(false)) and
    platform_backup_credential_dir.stat.uid == 0 and
    platform_backup_credential_dir.stat.mode == '0700'

- name: Validate an existing credential ownership marker
  ansible.builtin.assert:
    that:
      - platform_backup_credential_marker.stat.isreg | default(false)
      - not (platform_backup_credential_marker.stat.islnk | default(false))
      - platform_backup_credential_marker.stat.uid == 0
      - platform_backup_credential_marker.stat.mode == '0600'
      - platform_backup_credential_marker.stat.nlink == 1
      - platform_backup_credential_marker.stat.size <= 128
    fail_msg: Refusing to use an unsafe backup credential ownership marker.
  when: platform_backup_credential_marker.stat.exists | default(false)

- name: Read the credential ownership marker
  ansible.builtin.slurp:
    path: /etc/steward/secrets/backup/.steward-owned
  register: platform_backup_credential_marker_content
  no_log: true
  when: platform_backup_credential_marker.stat.exists | default(false)

- name: Refuse to adopt an unmarked credential directory
  ansible.builtin.assert:
    that:
      - platform_backup_credential_marker.stat.exists | default(false)
      - (platform_backup_credential_marker_content.content | default('') | b64decode | trim) == 'steward-backup-credentials-v1'
    fail_msg: Refusing to adopt a foreign backup credential directory.
  when: steward_backup.enabled and platform_backup_credential_dir.stat.exists

- name: Remove disabled or unused backup credentials
  ansible.builtin.file:
    path: "/etc/steward/secrets/backup/{{ item }}"
    state: absent
  loop: [repository, password, username, auth-password, ca]
  when:
    - platform_backup_credential_marker.stat.exists | default(false)
    - (platform_backup_credential_marker_content.content | default('') | b64decode | trim) == 'steward-backup-credentials-v1'
    - not steward_backup.enabled or item not in steward_backup.credentials
  no_log: true

- name: Clear disabled backup activation record
  ansible.builtin.file:
    path: /etc/steward/backup-activation
    state: absent
  when: not steward_backup.enabled
  no_log: true

- name: Atomically claim the private backup credential directory
  ansible.builtin.command:
    argv: [/opt/steward/current/venv/bin/python, -m, steward.core.backup_credentials]
  register: platform_backup_credential_claim
  changed_when: "'claimed' in platform_backup_credential_claim.stdout"
  when: steward_backup.enabled and not ansible_check_mode

- name: Reconcile durable backup activation
  ansible.builtin.include_tasks: backup_activation.yml
  when: steward_backup.enabled

- name: Transfer declared backup credentials
  ansible.builtin.copy:
    dest: "/etc/steward/secrets/backup/{{ item.name }}"
    content: >-
      {{ lookup('ansible.builtin.env', item.target) if item.kind == 'env'
         else lookup('ansible.builtin.file', item.target, lstrip=true, rstrip=true) }}
    owner: root
    group: root
    mode: "0600"
  loop: "{{ steward_backup_secrets }}"
  no_log: true
  diff: false
  notify: Restart backup service
  when: steward_backup.enabled and (not ansible_check_mode or platform_backup_credential_dir.stat.exists)

- name: Write backup worker endpoint configuration
  ansible.builtin.copy:
    dest: /etc/steward/backup.json
    content: "{{ steward_backup | to_nice_json }}\n"
    owner: root
    group: steward-backup
    mode: "0640"
  notify: Restart backup service
  when: steward_backup.enabled

- name: Pin the backup worker hosts mapping
  ansible.builtin.copy:
    dest: /etc/steward/backup-hosts
    content: "{{ steward_backup_hosts }}"
    owner: root
    group: steward-backup
    mode: "0640"
  notify: Restart backup service
  when: steward_backup.enabled

- name: Install backup service unit
  ansible.builtin.template:
    src: steward-backup.service.j2
    dest: /etc/systemd/system/steward-backup.service
    owner: root
    group: root
    mode: "0644"
  register: platform_backup_unit
  notify: Restart backup service
  when: steward_backup.enabled

- name: Enable and start configured backup worker
  ansible.builtin.systemd_service:
    name: steward-backup.service
    enabled: true
    state: started
    daemon_reload: "{{ platform_backup_unit is changed }}"
  when: steward_backup.enabled and not ansible_check_mode
