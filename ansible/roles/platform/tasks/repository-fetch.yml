---
- name: Inspect and withdraw repository fetch authority before platform changes
  when: platform_repository_fetch_phase == 'withdraw'
  vars:
    platform_repository_fetch_units:
      - {unit: steward-repository-fetch.service, description: Steward repository fetch}
      - {unit: steward-repository-source-handoff.service, description: Steward repository source handoff}
      - {unit: steward-repository-build-verify.service, description: Steward repository build input verification}
    platform_repository_fetch_custody: /var/lib/steward-repository-source-handoff
    platform_repository_fetch_authority: /etc/steward/repository-fetch
    platform_repository_fetch_lock_policy: /etc/tmpfiles.d/steward-repository-fetch.conf
  block:
    - name: Inspect the fixed repository fetch paths
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
        get_checksum: false
        get_mime: false
      loop:
        - /etc/steward
        - "{{ platform_repository_fetch_authority }}"
        - /etc/systemd
        - /etc/systemd/system
        - "{{ platform_repository_fetch_custody }}/ready"
        - /etc/tmpfiles.d
        - "{{ platform_repository_fetch_lock_policy }}"
        - "{{ platform_repository_fetch_custody }}/.staging/incoming"
        - "{{ platform_repository_fetch_custody }}/build-verify.json"
        - "{{ platform_repository_fetch_custody }}/.build-verify.incoming"
      register: platform_repository_fetch_paths

    - name: Require protected parent and authority directories
      ansible.builtin.assert:
        that:
          - item.stat.isdir | default(false)
          - item.stat.uid == 0
          - not item.stat.wgrp
          - not item.stat.woth
      loop: "{{ platform_repository_fetch_paths.results[:4] + [platform_repository_fetch_paths.results[5]] }}"
      loop_control:
        label: "{{ item.item }}"
      when: item.stat.exists

    - name: Require exact directory permissions for existing repository fetch authority
      ansible.builtin.assert:
        that:
          - platform_repository_fetch_paths.results[1].stat.mode == '0750'
          - platform_repository_fetch_paths.results[1].stat.gr_name == 'steward-repo-fetch'
      when: platform_repository_fetch_paths.results[1].stat.exists

    - name: Inspect the fixed repository unit fragments
      ansible.builtin.stat:
        path: "/etc/systemd/system/{{ item.unit }}"
        follow: false
        get_checksum: false
        get_mime: false
      loop: "{{ platform_repository_fetch_units }}"
      register: platform_repository_fetch_fragments

    - name: Require protected repository fragments before inspecting their contents
      ansible.builtin.assert:
        that:
          - item.stat.isreg | default(false)
          - item.stat.uid == 0
          - item.stat.gid == 0
          - item.stat.nlink == 1
          - item.stat.mode == '0644'
          - item.stat.size <= 65536
      loop: "{{ platform_repository_fetch_fragments.results }}"
      when: item.stat.exists

    - name: Read the protected repository unit fragments
      ansible.builtin.slurp:
        src: "{{ item.stat.path }}"
      loop: "{{ platform_repository_fetch_fragments.results }}"
      register: platform_repository_fetch_contents
      when: item.stat.exists

    - name: Refuse to manage foreign repository unit fragments
      ansible.builtin.assert:
        that:
          - >-
            (item.content | b64decode).splitlines()[:3] ==
            ['# Generated by steward - do not edit.', '[Unit]', 'Description=' ~ item.item.item.description]
      loop: "{{ platform_repository_fetch_contents.results }}"
      when: item is not skipped

    - name: Require the installed build verifier fragment to match the fixed template
      ansible.builtin.assert:
        that:
          - >-
            (platform_repository_fetch_contents.results[2].content | b64decode) ==
            lookup('ansible.builtin.template', role_path ~ '/templates/steward-repository-build-verify.service.j2')
      when: platform_repository_fetch_fragments.results[2].stat.exists

    - name: Inspect protected repository fetch authority files
      ansible.builtin.stat:
        path: "{{ platform_repository_fetch_authority }}/{{ item.name }}"
        follow: false
        get_checksum: false
        get_mime: false
      loop:
        - {name: active.json, mode: '0640', group: steward-repo-fetch}
        - {name: credential, mode: '0600', group: root}
      register: platform_repository_fetch_authority_files
      when: platform_repository_fetch_paths.results[1].stat.exists

    - name: Require existing repository fetch authority files to be protected
      ansible.builtin.assert:
        that:
          - item.stat.isreg | default(false)
          - item.stat.uid == 0
          - item.stat.gr_name == item.item.group
          - item.stat.nlink == 1
          - item.stat.mode == item.item.mode
      loop: "{{ platform_repository_fetch_authority_files.results }}"
      loop_control:
        label: "{{ item.item.name }}"
      when: item.stat.exists | default(false)

    - name: Detect installed or interrupted source handoff
      ansible.builtin.set_fact:
        platform_repository_handoff_needs_withdrawal: >-
          {{ platform_repository_fetch_fragments.results[1].stat.exists or
             platform_repository_fetch_fragments.results[2].stat.exists or
             platform_repository_fetch_paths.results[4].stat.exists or
             platform_repository_fetch_paths.results[7].stat.exists or
             platform_repository_fetch_paths.results[8].stat.exists or
             platform_repository_fetch_paths.results[9].stat.exists }}

    - name: Revoke ready source and withdraw the active manifest under the deployment lock
      ansible.builtin.command:
        argv:
          - /opt/steward/current/venv/bin/python
          - -I
          - -c
          - |
            from steward.application_boot import deployment_lock
            from steward.core.repository_fetch_package import withdraw_active

            with deployment_lock(timeout=30):
                withdraw_active()
      changed_when: true
      when: platform_repository_handoff_needs_withdrawal

    - name: Withdraw the active repository fetch manifest
      ansible.builtin.file:
        path: "{{ platform_repository_fetch_authority }}/active.json"
        state: absent
      when:
        - platform_repository_fetch_paths.results[1].stat.exists
        - not platform_repository_handoff_needs_withdrawal

    - name: Make withdrawal of the active manifest durable
      ansible.builtin.command:
        argv: [/usr/bin/sync, "{{ platform_repository_fetch_authority }}"]
      changed_when: false
      when:
        - platform_repository_fetch_paths.results[1].stat.exists
        - not platform_repository_handoff_needs_withdrawal

    - name: Inspect the effective repository units and overrides
      ansible.builtin.command:
        argv:
          - /usr/bin/systemctl
          - show
          - --all
          - --property=LoadState,ActiveState,UnitFileState,FragmentPath,DropInPaths,NeedDaemonReload
          - "{{ item.item.unit }}"
      loop: "{{ platform_repository_fetch_fragments.results }}"
      register: platform_repository_fetch_loaded
      changed_when: false
      failed_when: >-
        platform_repository_fetch_loaded.rc != 0 and
        'LoadState=not-found' not in platform_repository_fetch_loaded.stdout_lines

    - name: Refuse foreign repository unit sources, overrides and activation
      ansible.builtin.assert:
        that:
          - >-
            (item.item.stat.exists and
             (['LoadState=loaded', 'FragmentPath=' ~ unit_path, 'DropInPaths=', 'UnitFileState=static']
              | difference(item.stdout_lines) | length == 0))
            or (not item.item.stat.exists and
                (['LoadState=not-found', 'ActiveState=inactive', 'FragmentPath=', 'DropInPaths=']
                 | difference(item.stdout_lines) | length == 0
                 or (['LoadState=loaded', 'ActiveState=inactive', 'DropInPaths=', 'NeedDaemonReload=yes',
                      'FragmentPath=' ~ unit_path] | difference(item.stdout_lines) | length == 0)))
      vars:
        unit_path: "/etc/systemd/system/{{ item.item.item.unit }}"
      loop: "{{ platform_repository_fetch_loaded.results }}"

    # A stop can wait for a root hook that needs the deployment lock.
    - name: Stop the managed repository cgroups before touching firewall or credentials
      ansible.builtin.command:
        argv: [/usr/bin/systemctl, stop, "{{ item.item.item.unit }}"]
      changed_when: "'ActiveState=inactive' not in item.stdout_lines"
      loop: "{{ platform_repository_fetch_loaded.results }}"
      when: "'LoadState=loaded' in item.stdout_lines"

    - name: Verify the stopped build verifier cgroup has drained before removing its fragment
      when: platform_repository_fetch_fragments.results[2].stat.exists
      vars:
        platform_repository_build_verify_cgroup: /sys/fs/cgroup/system.slice/steward-repository-build-verify.service
      block:
        - name: Read the stopped build verifier process state
          ansible.builtin.command:
            argv:
              - /usr/bin/systemctl
              - show
              - --all
              - --property=Id,ActiveState,SubState,ControlGroup,Job,MainPID,ControlPID
              - steward-repository-build-verify.service
          register: platform_repository_build_verify_stopped
          changed_when: false

        - name: Require the build verifier to have no running or pending process
          ansible.builtin.assert:
            that:
              - >-
                ['Id=steward-repository-build-verify.service', 'MainPID=0', 'ControlPID=0']
                | difference(platform_repository_build_verify_stopped.stdout_lines) | length == 0
              - >-
                ('ActiveState=inactive' in platform_repository_build_verify_stopped.stdout_lines and
                 'SubState=dead' in platform_repository_build_verify_stopped.stdout_lines) or
                ('ActiveState=failed' in platform_repository_build_verify_stopped.stdout_lines and
                 'SubState=failed' in platform_repository_build_verify_stopped.stdout_lines)
              - >-
                'ControlGroup=' in platform_repository_build_verify_stopped.stdout_lines or
                'ControlGroup=/system.slice/steward-repository-build-verify.service'
                in platform_repository_build_verify_stopped.stdout_lines
              - >-
                'Job=' in platform_repository_build_verify_stopped.stdout_lines or
                'Job=0' in platform_repository_build_verify_stopped.stdout_lines

        - name: Inspect the build verifier unified cgroup hierarchy
          ansible.builtin.stat:
            path: "{{ item }}"
            follow: false
            get_checksum: false
            get_mime: false
          loop: [/sys/fs/cgroup/cgroup.controllers, "{{ platform_repository_build_verify_cgroup }}"]
          register: platform_repository_build_verify_cgroup_paths

        - name: Require the unified cgroup hierarchy
          ansible.builtin.assert:
            that:
              - platform_repository_build_verify_cgroup_paths.results[0].stat.isreg | default(false)
              - >-
                not platform_repository_build_verify_cgroup_paths.results[1].stat.exists or
                platform_repository_build_verify_cgroup_paths.results[1].stat.isdir | default(false)

        - name: Verify the build verifier cgroup has no descendants
          when: platform_repository_build_verify_cgroup_paths.results[1].stat.exists
          block:
            - name: Read recursive build verifier cgroup population
              ansible.builtin.slurp:
                src: "{{ platform_repository_build_verify_cgroup }}/cgroup.events"
              register: platform_repository_build_verify_population

            - name: Require the build verifier cgroup to be empty
              ansible.builtin.assert:
                that:
                  - "'populated 0' in (platform_repository_build_verify_population.content | b64decode).splitlines()"

    - name: Remove the retired repository unit fragments
      ansible.builtin.file:
        path: "{{ item.stat.path }}"
        state: absent
      loop: "{{ platform_repository_fetch_fragments.results }}"
      when: item.stat.exists

    - name: Detect when retiring repository units requires a daemon reload
      ansible.builtin.set_fact:
        platform_repository_fetch_reload: >-
          {{ platform_repository_fetch_loaded.results
             | selectattr('stdout_lines', 'contains', 'LoadState=loaded') | list | length > 0 }}

    - name: Reload systemd after withdrawing the repository units
      ansible.builtin.systemd_service:
        daemon_reload: true
      when: platform_repository_fetch_reload

    - name: Refuse foreign units exposed by removing the managed fragments
      ansible.builtin.command:
        argv:
          - /usr/bin/systemctl
          - show
          - --all
          - --property=LoadState,ActiveState,FragmentPath,DropInPaths
          - "{{ item.item.item.unit }}"
      loop: "{{ platform_repository_fetch_loaded.results }}"
      register: platform_repository_fetch_retired_source
      changed_when: false
      failed_when: >-
        ['LoadState=not-found', 'ActiveState=inactive', 'FragmentPath=', 'DropInPaths=']
        | difference(platform_repository_fetch_retired_source.stdout_lines) | length > 0
      when: platform_repository_fetch_reload

    - name: Remove the withdrawn repository fetch credential
      ansible.builtin.file:
        path: "{{ platform_repository_fetch_authority }}/credential"
        state: absent
      when: platform_repository_fetch_paths.results[1].stat.exists
      no_log: true
      diff: false

    - name: Require a protected existing fetch lock policy
      ansible.builtin.assert:
        that:
          - platform_repository_fetch_paths.results[1].stat.exists
          - platform_repository_fetch_paths.results[6].stat.isreg | default(false)
          - platform_repository_fetch_paths.results[6].stat.uid == 0
          - platform_repository_fetch_paths.results[6].stat.gid == 0
          - platform_repository_fetch_paths.results[6].stat.mode == '0644'
          - platform_repository_fetch_paths.results[6].stat.nlink == 1
      when: platform_repository_fetch_paths.results[6].stat.exists

    - name: Remove the withdrawn candidate boot lock policy
      ansible.builtin.file:
        path: "{{ platform_repository_fetch_lock_policy }}"
        state: absent
      when: platform_repository_fetch_paths.results[6].stat.exists

- name: Stage the repository fetch candidate from the installed release
  when: platform_repository_fetch_phase == 'stage'
  block:
    - name: Install candidate repository fetch clients
      ansible.builtin.apt:
        name: [git, openssh-client]
        state: present
        install_recommends: false

    - name: Inspect the repository fetch store and its parents
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
        get_checksum: false
        get_mime: false
      loop: [/var, /var/lib, /run, /var/lib/steward-repository-fetch, /run/steward-repository-fetch]
      register: platform_repository_fetch_store_paths

    - name: Require protected store and runtime parents
      ansible.builtin.assert:
        that:
          - item.stat.isdir | default(false)
          - item.stat.uid == 0
          - not item.stat.wgrp
          - not item.stat.woth
      loop: "{{ platform_repository_fetch_store_paths.results[:3] }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Require any existing store to be private and dedicated
      ansible.builtin.assert:
        that:
          - platform_repository_fetch_store_paths.results[3].stat.isdir | default(false)
          - platform_repository_fetch_store_paths.results[3].stat.pw_name == 'steward-repo-fetch'
          - platform_repository_fetch_store_paths.results[3].stat.gr_name == 'steward-repo-fetch'
          - platform_repository_fetch_store_paths.results[3].stat.mode == '0700'
      when: platform_repository_fetch_store_paths.results[3].stat.exists

    - name: Require the ephemeral runtime directory to be absent after withdrawal
      ansible.builtin.assert:
        that: not platform_repository_fetch_store_paths.results[4].stat.exists

    - name: Create the protected repository fetch authority directory
      ansible.builtin.file:
        path: /etc/steward/repository-fetch
        state: directory
        owner: root
        group: steward-repo-fetch
        mode: "0750"

    - name: Inspect any repository scope seal before reusing a store
      ansible.builtin.stat:
        path: /etc/steward/repository-fetch/scope.json
        follow: false
        get_checksum: false
        get_mime: false
      register: platform_repository_fetch_scope
      when: platform_repository_fetch_store_paths.results[3].stat.exists

    - name: Refuse to adopt an unsealed repository store
      ansible.builtin.assert:
        that: platform_repository_fetch_scope.stat.exists
      when: platform_repository_fetch_store_paths.results[3].stat.exists

    - name: Seal repository scope before managing the private store
      ansible.builtin.command:
        argv: [/opt/steward/current/venv/bin/python, -I, -m, steward.core.repository_fetch_package, seal]
        stdin: "{{ steward_repository_fetch.manifest | to_json }}"
      register: platform_repository_fetch_seal
      changed_when: true

    - name: Create the private repository store
      ansible.builtin.file:
        path: /var/lib/steward-repository-fetch
        state: directory
        owner: steward-repo-fetch
        group: steward-repo-fetch
        mode: "0700"

    - name: Install the selected root-only Git credential
      ansible.builtin.copy:
        content: >-
          {{ lookup('ansible.builtin.env', steward_repository_fetch.credential.target, default=undef())
             if steward_repository_fetch.credential.kind == 'env'
             else lookup('ansible.builtin.file', steward_repository_fetch.credential.target, rstrip=false) }}
        dest: /etc/steward/repository-fetch/credential
        owner: root
        group: root
        mode: "0600"
      no_log: true
      diff: false
      when: steward_repository_fetch.manifest.credential_required

    - name: Install the manual repository fetch unit
      ansible.builtin.template:
        src: steward-repository-fetch.service.j2
        dest: /etc/systemd/system/steward-repository-fetch.service
        owner: root
        group: root
        mode: "0644"

    - name: Stage the manual repository source handoff
      when: steward_repository_fetch.manifest.handoff is defined and steward_repository_fetch.manifest.handoff is not none
      block:
        - name: Provision the build input group
          ansible.builtin.group:
            name: steward-build-input
            system: true

        - name: Inspect the source handoff custody directory
          ansible.builtin.stat:
            path: /var/lib/steward-repository-source-handoff
            follow: false
            get_checksum: false
            get_mime: false
          register: platform_repository_handoff_custody

        - name: Require protected existing source handoff custody
          ansible.builtin.assert:
            that:
              - platform_repository_handoff_custody.stat.isdir | default(false)
              - platform_repository_handoff_custody.stat.pw_name == 'root'
              - platform_repository_handoff_custody.stat.gr_name == 'steward-build-input'
              - platform_repository_handoff_custody.stat.mode == '0750'
          when: platform_repository_handoff_custody.stat.exists

        - name: Create the root-owned source handoff custody directory
          ansible.builtin.file:
            path: /var/lib/steward-repository-source-handoff
            state: directory
            owner: root
            group: steward-build-input
            mode: '0750'

        - name: Install the manual repository source handoff unit
          ansible.builtin.template:
            src: steward-repository-source-handoff.service.j2
            dest: /etc/systemd/system/steward-repository-source-handoff.service
            owner: root
            group: root
            mode: '0644'

        - name: Stage the manual repository build verifier
          vars:
            platform_repository_build_verify_store: /var/lib/steward-repository-build-verify
            platform_repository_build_verify_identity:
              [/opt/steward/current/venv/bin/python, -I, -m, steward.core.repository_build_verify, identity]
          block:
            - name: Check the existing build verifier identity before provisioning it
              ansible.builtin.command:
                argv: "{{ platform_repository_build_verify_identity }}"
              changed_when: false

            - name: Inspect the build verifier worker directory
              ansible.builtin.stat:
                path: "{{ platform_repository_build_verify_store }}"
                follow: false
                get_checksum: false
                get_mime: false
              register: platform_repository_build_verify_path

            - name: Refuse to adopt a foreign build verifier worker directory
              ansible.builtin.assert:
                that:
                  - platform_repository_build_verify_path.stat.isdir | default(false)
                  - platform_repository_build_verify_path.stat.pw_name == 'steward-repo-build'
                  - platform_repository_build_verify_path.stat.gr_name == 'steward-repo-build'
                  - platform_repository_build_verify_path.stat.mode == '0700'
              when: platform_repository_build_verify_path.stat.exists

            - name: Provision the build verifier private group
              ansible.builtin.group:
                name: steward-repo-build
                system: true

            - name: Provision the locked build verifier account
              ansible.builtin.user:
                name: steward-repo-build
                group: steward-repo-build
                groups: ''
                system: true
                home: /nonexistent
                create_home: false
                shell: /usr/sbin/nologin
                password_lock: true

            - name: Validate the provisioned build verifier identity
              ansible.builtin.command:
                argv: "{{ platform_repository_build_verify_identity }}"
              changed_when: false

            - name: Create the private build verifier worker directory
              ansible.builtin.file:
                path: "{{ platform_repository_build_verify_store }}"
                state: directory
                owner: steward-repo-build
                group: steward-repo-build
                mode: '0700'

            - name: Install the manual repository build verifier unit
              ansible.builtin.template:
                src: steward-repository-build-verify.service.j2
                dest: /etc/systemd/system/steward-repository-build-verify.service
                owner: root
                group: root
                mode: '0644'

    - name: Provision the existing deployment lock at boot for read-only fetch verification
      ansible.builtin.copy:
        dest: /etc/tmpfiles.d/steward-repository-fetch.conf
        content: |
          # Generated by Steward for repository fetch.
          d /run/steward-executor 0750 root steward-exec -
          d /run/steward-executor/locks 0700 root root -
          f /run/steward-executor/locks/deployment-execution.lock 0600 root root -
        owner: root
        group: root
        mode: "0644"

    - name: Reload the manual repository fetch unit
      ansible.builtin.systemd_service:
        daemon_reload: true

    - name: Require the inactive repository fetch unit to load from the managed fragment alone
      ansible.builtin.command:
        argv:
          - /usr/bin/systemctl
          - show
          - --all
          - --property=LoadState,ActiveState,UnitFileState,FragmentPath,DropInPaths,NeedDaemonReload
          - steward-repository-fetch.service
      register: platform_repository_fetch_source
      changed_when: false
      failed_when: >-
        platform_repository_fetch_source.rc != 0 or
        (['LoadState=loaded', 'ActiveState=inactive', 'UnitFileState=static',
          'FragmentPath=/etc/systemd/system/steward-repository-fetch.service',
          'DropInPaths=', 'NeedDaemonReload=no']
         | difference(platform_repository_fetch_source.stdout_lines) | length > 0)

    - name: Require the inactive handoff unit to load from the managed fragment alone
      ansible.builtin.command:
        argv:
          - /usr/bin/systemctl
          - show
          - --all
          - --property=LoadState,ActiveState,FragmentPath,DropInPaths,UnitFileState,NeedDaemonReload
          - steward-repository-source-handoff.service
      register: platform_repository_handoff_source
      changed_when: false
      failed_when: >-
        platform_repository_handoff_source.rc != 0 or
        (['LoadState=loaded', 'ActiveState=inactive',
          'FragmentPath=/etc/systemd/system/steward-repository-source-handoff.service',
          'DropInPaths=', 'UnitFileState=static', 'NeedDaemonReload=no']
         | difference(platform_repository_handoff_source.stdout_lines) | length > 0)
      when:
        - not ansible_check_mode
        - steward_repository_fetch.manifest.handoff is defined and steward_repository_fetch.manifest.handoff is not none

    - name: Require the inactive build verifier to load from the static managed fragment alone
      ansible.builtin.command:
        argv:
          - /usr/bin/systemctl
          - show
          - --all
          - --property=LoadState,ActiveState,FragmentPath,DropInPaths,UnitFileState,NeedDaemonReload
          - steward-repository-build-verify.service
      register: platform_repository_build_verify_source
      changed_when: false
      failed_when: >-
        platform_repository_build_verify_source.rc != 0 or
        (['LoadState=loaded', 'ActiveState=inactive',
          'FragmentPath=/etc/systemd/system/steward-repository-build-verify.service',
          'DropInPaths=', 'UnitFileState=static', 'NeedDaemonReload=no']
         | difference(platform_repository_build_verify_source.stdout_lines) | length > 0)
      when:
        - not ansible_check_mode
        - steward_repository_fetch.manifest.handoff is defined and steward_repository_fetch.manifest.handoff is not none
