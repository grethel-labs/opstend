---
- name: Find installed dedicated application manager ordering
  ansible.builtin.find:
    paths: /etc/systemd/system
    patterns: 90-steward-applications.conf
    recurse: true
    depth: 2
    file_type: file
    follow: false
  register: verify_application_manager_ordering

- name: Remove obsolete dedicated application manager ordering
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  vars:
    verify_manager_uid: "{{ item.path | regex_search('user@([3][0-9]{4})[.]service[.]d/', '\\1') }}"
  loop: "{{ verify_application_manager_ordering.files }}"
  loop_control:
    label: "{{ item.path }}"
  when:
    - item.path is match('^/etc/systemd/system/user@3[0-9]{4}[.]service[.]d/90-steward-applications[.]conf$')
    - (verify_manager_uid | first | int) not in (workloads_application_boot_uids | default([]) | map('int'))
  register: verify_application_manager_ordering_removed

- name: Reload systemd after retiring application boot ordering
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: verify_application_manager_ordering_removed is changed
