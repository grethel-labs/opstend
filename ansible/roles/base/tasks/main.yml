---
- name: Install base packages
  ansible.builtin.apt:
    name:
      - apparmor
      - ca-certificates
      - crun
      - dbus-user-session
      - nftables
      - passt
      - podman
      - python3-cryptography
      - python3-packaging
      - python3-venv
      - uidmap
      - unattended-upgrades
    state: present
    update_cache: true
    cache_valid_time: 86400

- name: Check Podman version
  ansible.builtin.command:
    argv: [podman, version, --format, "{{ '{{.Client.Version}}' }}"]
  register: base_podman
  changed_when: false
  check_mode: false

- name: Require a tested Podman/Quadlet version
  ansible.builtin.assert:
    that: base_podman.stdout is version('5.4', '>=')
    fail_msg: Podman {{ base_podman.stdout }} is older than the tested minimum 5.4.

- name: Create journald drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    mode: "0755"

- name: Limit journald
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf.d/50-steward.conf
    content: |
      # Generated by steward - do not edit.
      [Journal]
      SystemMaxUse={{ steward_hardening.journald.system_max_use_mb }}M
      MaxRetentionSec={{ steward_hardening.journald.retention_days }}day
      ForwardToSyslog=no
    mode: "0644"
  notify: Restart journald

- name: Apply kernel and network sysctls
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/60-steward.conf
    state: present
  loop: "{{ base_sysctls | dict2items }}"
  vars:
    # Tightening only. Nothing here relaxes a kernel protection for containers.
    base_sysctls:
      kernel.dmesg_restrict: "1"
      kernel.kptr_restrict: "2"
      kernel.kexec_load_disabled: "1"
      fs.protected_fifos: "2"
      fs.protected_regular: "2"
      net.ipv4.conf.all.accept_redirects: "0"
      net.ipv4.conf.default.accept_redirects: "0"
      net.ipv4.conf.all.send_redirects: "0"
      net.ipv4.conf.all.accept_source_route: "0"
      net.ipv4.tcp_syncookies: "1"
      net.ipv6.conf.all.accept_redirects: "0"
      net.ipv6.conf.default.accept_redirects: "0"
      net.ipv6.conf.all.accept_source_route: "0"

- name: Configure automatic security updates
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/52steward-unattended
    content: |
      // Generated by steward - do not edit.
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "{{ '1' if steward_hardening.unattended_security_upgrades else '0' }}";
      Unattended-Upgrade::Automatic-Reboot "false";
    mode: "0644"

- name: Harden SSH
  ansible.builtin.include_tasks: ssh.yml
  when: steward_hardening.ssh.manage

- name: Install the shared application pod init
  ansible.builtin.apt:
    name: catatonit
    state: present
  when: steward_applications | default([]) | selectattr('pod') | list | length > 0
