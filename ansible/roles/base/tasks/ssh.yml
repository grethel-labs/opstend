---
# Existing keys, sudo and tunnels are not touched. A change is syntax-checked,
# armed with a rollback timer, then proven with a brand-new connection.
- name: Write SSH hardening drop-in
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/50-steward.conf
    content: |
      # Generated by steward - do not edit.
      PasswordAuthentication {{ 'yes' if steward_hardening.ssh.password_authentication else 'no' }}
      KbdInteractiveAuthentication no
      PermitEmptyPasswords no
      PermitRootLogin {{ steward_hardening.ssh.permit_root_login }}
      X11Forwarding no
    mode: "0600"
    backup: true
    validate: /usr/sbin/sshd -t -f %s
  register: base_ssh

- name: Apply SSH change with rollback protection
  when: base_ssh is changed
  block:
    - name: Arm SSH rollback timer
      ansible.builtin.command:
        argv:
          - systemd-run
          - --unit=steward-ssh-rollback
          - --on-active=180
          - /bin/sh
          - -c
          - >-
            {{ ('cp -f ' ~ base_ssh.backup_file ~ ' /etc/ssh/sshd_config.d/50-steward.conf')
               if base_ssh.backup_file is defined and base_ssh.backup_file
               else 'rm -f /etc/ssh/sshd_config.d/50-steward.conf' }};
            systemctl reload-or-restart ssh.service
      changed_when: true

    - name: Check complete sshd configuration
      ansible.builtin.command:
        argv: [/usr/sbin/sshd, -t]
      changed_when: false

    - name: Reload sshd
      ansible.builtin.command:
        argv: [systemctl, reload-or-restart, ssh.service]
      changed_when: true

    - name: Drop the existing connection
      ansible.builtin.meta: reset_connection

    - name: Prove that a new SSH connection works
      ansible.builtin.wait_for_connection:
        timeout: 90

    - name: Disarm SSH rollback timer
      ansible.builtin.command:
        argv: [systemctl, stop, steward-ssh-rollback.timer]
      changed_when: true

    - name: Remove SSH backup
      ansible.builtin.file:
        path: "{{ base_ssh.backup_file }}"
        state: absent
      when: base_ssh.backup_file is defined and (base_ssh.backup_file | length > 0)
