---
- name: Read the port sshd really serves this connection on
  ansible.builtin.command:
    argv: [printenv, SSH_CONNECTION]
  become: false
  register: firewall_ssh
  changed_when: false
  check_mode: false

- name: Refuse a ruleset that would not admit this SSH connection
  ansible.builtin.assert:
    that: (firewall_ssh.stdout.split() | last | int) == (steward_ssh_port | int)
    fail_msg: >-
      The ruleset opens SSH port {{ steward_ssh_port }}, but this connection arrives on
      port {{ firewall_ssh.stdout.split() | last }}.
