---
- name: Create ruleset directory
  ansible.builtin.file:
    path: /etc/steward/nftables
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Install firewall policy helper
  ansible.builtin.copy:
    src: firewall-policy.py
    dest: /etc/steward/nftables/firewall-policy.py
    owner: root
    group: root
    mode: "0700"

- name: Inspect verified and live firewall state
  ansible.builtin.command:
    argv: [/usr/bin/python3, /etc/steward/nftables/firewall-policy.py, inspect]
  register: firewall_inspection
  changed_when: false

- name: Verify existing SSH access before migrating legacy policy
  ansible.builtin.include_tasks: verify-ssh.yml
  when: (firewall_inspection.stdout | from_json).state == 'legacy'

- name: Adopt the verified live firewall as the boot and rollback policy
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - /etc/steward/nftables/firewall-policy.py
      - bootstrap
      - "{{ (firewall_inspection.stdout | from_json).runtime }}"
  changed_when: true
  when: (firewall_inspection.stdout | from_json).state == 'legacy'

- name: Install firewall unit
  ansible.builtin.copy:
    dest: /etc/systemd/system/steward-firewall.service
    content: |
      # Generated by steward - do not edit.
      [Unit]
      Description=steward nftables ruleset (host firewall and service isolation)
      Wants=network-pre.target
      Before=network-pre.target
      After=local-fs.target
      AssertPathExists=/etc/steward/nftables/steward.nft

      [Service]
      Type=oneshot
      RemainAfterExit=yes
      ExecStart=/usr/bin/python3 /etc/steward/nftables/firewall-policy.py load-verified
      ExecReload=/usr/bin/python3 /etc/steward/nftables/firewall-policy.py load-verified
      ExecStop=/usr/bin/python3 /etc/steward/nftables/firewall-policy.py stop-verified

      [Install]
      WantedBy=multi-user.target
    owner: root
    group: root
    mode: "0644"

- name: Enable firewall at boot
  ansible.builtin.systemd_service:
    name: steward-firewall.service
    enabled: true
    # A prior run may have installed the unit without reloading systemd.
    daemon_reload: true

- name: Stage and apply firewall policy with rollback protection
  ansible.builtin.command:
    argv: [/usr/bin/python3, /etc/steward/nftables/firewall-policy.py, apply]
    stdin: "{{ steward_nftables }}"
    stdin_add_newline: false
  register: firewall_candidate
  changed_when: firewall_candidate.rc == 0 and (firewall_candidate.stdout | from_json).changed

- name: Verify candidate firewall over a fresh SSH connection
  ansible.builtin.include_tasks: verify-ssh.yml
  when: firewall_candidate is changed

- name: Promote the SSH-verified firewall policy
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - /etc/steward/nftables/firewall-policy.py
      - commit
      - "{{ (firewall_candidate.stdout | from_json).attempt }}"
  changed_when: true
  when: firewall_candidate is changed

- name: Start the firewall unit with the verified policy
  ansible.builtin.systemd_service:
    name: steward-firewall.service
    state: started
