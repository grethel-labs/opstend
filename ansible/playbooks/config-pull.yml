---
# Read configuration without requiring a local workload/resource specification.
- name: Pull server configuration
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Read installation identity
      ansible.builtin.slurp:
        path: /etc/steward/install.json
      register: pull_install

    - name: Verify server identity before reading configuration
      ansible.builtin.assert:
        that:
          - (pull_install.content | b64decode | from_json).server_name == steward_server_name
        fail_msg: This installation belongs to a different server name.

    - name: Read head revision exported by the admin API
      ansible.builtin.slurp:
        path: /var/lib/steward-api/export/head.json
      register: pull_head

    - name: Store configuration on controller for local validation
      ansible.builtin.copy:
        content: "{{ {'head': pull_head.content | b64decode | from_json} | to_json }}"
        dest: "{{ steward_local_dir }}/remote-state.json"
        mode: "0600"
      delegate_to: localhost
      become: false
