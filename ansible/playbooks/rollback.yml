---
- name: Roll back one applied verified update through the registered executor action
  hosts: all
  become: true
  tasks:
    - name: Request the rollback
      ansible.builtin.command:
        argv: >-
          {{ ['/opt/steward/current/venv/bin/steward-host', 'rollback', steward_rollback_project,
              '--approval-id', steward_rollback_approval, '--digest', steward_rollback_digest]
             + (['--acknowledge-data-restore'] if steward_rollback_restore | bool else []) }}
      register: steward_rollback_request
      changed_when: true

    - name: Store the response on the controller
      ansible.builtin.copy:
        content: "{{ steward_rollback_request.stdout }}"
        dest: "{{ steward_local_dir }}/rollback-result.json"
        mode: "0600"
      delegate_to: localhost
      become: false
      changed_when: false
