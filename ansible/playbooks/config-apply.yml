---
- name: Apply the reviewed pending web UI revision through the registered executor action
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Request the apply
      ansible.builtin.command:
        argv:
          - /opt/steward/current/venv/bin/steward-host
          - config-apply
          - --head
          - "{{ steward_apply_head }}"
          - --applied
          - "{{ steward_apply_applied }}"
      register: steward_config_apply
      changed_when: true

    - name: Store the response on the controller
      ansible.builtin.copy:
        content: "{{ steward_config_apply.stdout }}"
        dest: "{{ steward_local_dir }}/config-apply-result.json"
        mode: "0600"
      delegate_to: localhost
      become: false
      changed_when: false
