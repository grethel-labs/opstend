name: ci

on:
  push:
    branches: [main]
  pull_request:

# Pull requests from forks run with a read-only token and no secrets.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --frozen --extra controller
      - name: Guardrails
        run: uv run --no-sync python tests/run_guardrails.py -n auto
      - run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends nftables podman
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: Remaining Python tests
        run: uv run --no-sync pytest -n auto --exclude-guardrails --durations=10
      - name: Lock file export is current
        run: |
          uv export --frozen --no-dev --extra controller --no-emit-project \
            --format requirements-txt --output-file /tmp/controller.txt >/dev/null
          diff <(grep -v '^#' /tmp/controller.txt) <(grep -v '^#' requirements/controller.txt)

  ansible:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --frozen --extra controller
      - run: uv run ansible-galaxy collection install -r ansible/requirements.yml -p .steward/collections
      - name: ansible-lint (includes syntax check)
        working-directory: ansible
        env:
          ANSIBLE_COLLECTIONS_PATH: ../.steward/collections
        run: uv run ansible-lint playbooks roles

  webapp:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - working-directory: webapp
        run: npm ci --no-audit --no-fund
      - working-directory: webapp
        run: npm run build
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --frozen
      - working-directory: webapp
        run: npx playwright install --with-deps chromium
      - working-directory: webapp
        run: npx playwright test
      - name: Bundle must work under the strict CSP (no inline scripts)
        run: "! grep -q '<script>' webapp/dist/index.html"
