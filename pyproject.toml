[project]
name = "opstend"
dynamic = ["version"]
description = "Self-managing operations for Proxmox, Linux and UniFi: inventory, network insight, security scans, coordinated updates and AI-assisted deployment."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "Grethel Labs" }]
dependencies = [
    "cryptography>=44",
    "fastapi>=0.115",
    "httpx>=0.28",
    "pydantic>=2.9",
    "pyyaml>=6.0.2",
    "tzdata>=2025.2",
    "uvicorn>=0.32",
]

[project.optional-dependencies]
# Verifies signed releases during self-update. Installed by the release bundle.
signing = ["sigstore>=3.6"]
# Zorec with Claude. Local models need no extra package.
anthropic = ["anthropic>=2.14"]

[project.urls]
Repository = "https://github.com/grethel-labs/opstend"
Documentation = "https://github.com/grethel-labs/opstend/tree/main/docs"

[project.scripts]
opstend = "opstend.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.29.0",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/opstend/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/opstend"]
artifacts = ["src/opstend/api/static/**"]

[tool.hatch.build.targets.sdist]
include = ["src/opstend", "README.md", "LICENSE"]
artifacts = ["src/opstend/api/static/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q -m \"not cluster\""
markers = ["cluster: multi-process cluster test (slow)"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["RUF012", "RUF001", "B008", "E501", "SIM102", "S603"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108", "S311", "S104", "S501", "SIM115"]

[tool.mypy]
python_version = "3.12"
packages = ["opstend"]
mypy_path = "src"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
