[project]
name = "steward"
version = "0.1.0rc1"
description = "OpsTend: self-hosted hardening, workload isolation and guarded automation for Linux servers"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=46",
    "fastapi>=0.115",
    "pydantic>=2.9",
    "pyyaml>=6.0.2",
    "uvicorn>=0.32",
]

[project.urls]
Repository = "https://github.com/grethel-labs/opstend"
Documentation = "https://github.com/grethel-labs/opstend/tree/main/docs"

[project.optional-dependencies]
controller = ["ansible-core>=2.20,<2.21"]

[project.scripts]
opstend = "steward.cli.main:main"
opstend-host = "steward.hostcli:main"
opstend-api = "steward.api.server:main"
opstend-executor = "steward.executor.server:main"
opstend-controller = "steward.controller:main"
opstend-collector = "steward.collector:main"
opstend-notifier = "steward.notifier:main"
opstend-bot = "steward.bot:main"
opstend-scan = "steward.scanner:main"
opstend-scannerd = "steward.scannerd:main"
opstend-backup = "steward.backup:main"
opstend-backupd = "steward.backupworker:main"

# Existing host units and operator scripts use these entry points.
steward = "steward.cli.main:main"
steward-host = "steward.hostcli:main"
steward-api = "steward.api.server:main"
steward-executor = "steward.executor.server:main"
steward-controller = "steward.controller:main"
steward-collector = "steward.collector:main"
steward-notifier = "steward.notifier:main"
steward-bot = "steward.bot:main"
steward-scan = "steward.scanner:main"
steward-scannerd = "steward.scannerd:main"
steward-backup = "steward.backup:main"
steward-backupd = "steward.backupworker:main"

[dependency-groups]
dev = [
    "ansible-lint>=25",
    "httpx2>=2.16.0",
    "jsonschema>=4.23",
    "pytest>=8.3",
    "pytest-xdist>=3.8,<4",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/steward"]
artifacts = ["src/steward/api/static/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["S101", "S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S104", "S105", "S106", "S108", "E501"]
